<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pez sidebar icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECE4D2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1712px; height: 2140px; box-sizing: border-box; padding: 48px; background: #101317; color: #E8EBEE; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 40px">
<header style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #2A3138; padding-bottom: 24px">
<h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 44px">Sidebar icons</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #9BA5AE">256 × 192 PNG · three-quarter view · no text · rendered from the blockout models in Blueberry</span>
</header>
<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Structures</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{structures}}" as="it" hint-placeholder-count="16">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px"><img src="{{it.src}}" alt="{{it.key}}" style="width: 256px; height: 192px; border-radius: 8px; outline: 1px solid #2A3138"><figcaption style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-family: 'IBM Plex Mono', monospace">{{it.key}}</span><span style="color: #9BA5AE">{{it.size}}</span></figcaption></figure>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Units</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{units}}" as="it" hint-placeholder-count="14">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px"><img src="{{it.src}}" alt="{{it.key}}" style="width: 256px; height: 192px; border-radius: 8px; outline: 1px solid #2A3138"><figcaption style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-family: 'IBM Plex Mono', monospace">{{it.key}}</span><span style="color: #9BA5AE">{{it.size}}</span></figcaption></figure>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Ores</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{ores}}" as="it" hint-placeholder-count="4">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px"><img src="{{it.src}}" alt="{{it.key}}" style="width: 256px; height: 192px; border-radius: 8px; outline: 1px solid #2A3138"><figcaption style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-family: 'IBM Plex Mono', monospace">{{it.key}}</span><span style="color: #9BA5AE">{{it.size}}</span></figcaption></figure>
</sc-for>
</div>
</section>
</div>
</x-dc>

</body>
</html>
