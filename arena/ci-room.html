<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pezz: CI room</title>
<style>
  /* The browser build (an iframe on the kitchen sink room's spectator view) beside the catalog of every district and exhibit.
     Click one and the view reloads at its camera (cam=x,y,zoom). Plain on purpose: the game is the thing being looked at. */
  :root { --bg:#2A2420; --panel:#101317; --border:#2A3138; --line:#3A4047; --btn:#22282E; --ink:#E8EBEE; --cream:#ECE4D2; --muted:#9BA5AE; --soft:#C5CCD2; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  button { font:inherit; color:var(--ink); background:var(--btn); border:0; border-radius:8px; cursor:pointer; height:34px; min-width:40px; padding:0 10px; }
  button.on { background:var(--cream); color:#101317; font-weight:500; }
  .mono { font-family:ui-monospace,Menlo,monospace; }

  #top { flex:none; display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border); min-height:34px; }
  #top .word { font-weight:700; font-size:18px; letter-spacing:.04em; }
  #top .sub { color:var(--muted); font-size:12px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  #now { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #now b { font-weight:600; } #now span { color:var(--soft); margin-left:8px; font-size:13px; }
  #stat { color:var(--muted); font-size:12px; white-space:nowrap; }
  #speed { display:flex; gap:4px; }

  #main { flex:1; display:flex; min-height:0; }
  #index { flex:none; width:330px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border); min-height:0; }
  .find { padding:10px 10px 6px; display:flex; gap:8px; }
  #q { flex:1; height:32px; border-radius:8px; border:1px solid var(--line); background:#0B0D10; color:var(--ink); padding:0 10px; font:inherit; outline:none; min-width:0; }
  #q:focus { border-color:var(--cream); }
  #list { overflow-y:auto; padding:0 6px 12px 10px; flex:1; }
  .dh { display:flex; align-items:baseline; gap:8px; cursor:pointer; padding:6px 8px; margin-top:8px; border-radius:8px; }
  .dh b { font-weight:600; font-size:15px; } .dh span { color:var(--muted); font-size:12px; }
  .about { color:var(--muted); font-size:12.5px; padding:0 8px 4px; }
  .it { padding:5px 8px 5px 18px; border-radius:8px; cursor:pointer; border-left:3px solid transparent; }
  .it b { font-weight:500; font-size:13.5px; } .it div { color:var(--muted); font-size:12px; line-height:1.35; }
  .dh:hover, .it:hover { background:#1B2026; }
  .cur { background:#1F252B; border-left:3px solid var(--cream); }

  #view { flex:1; position:relative; min-width:0; }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  #legend { position:absolute; right:12px; top:12px; width:360px; max-height:70%; overflow-y:auto; padding:12px 14px; display:none; background:rgba(16,19,23,.95); border:1px solid var(--border); border-radius:12px; z-index:3; }
  #legend.open { display:block; }
  #legend dt { font-weight:600; margin-top:8px; } #legend dd { margin:1px 0 0; color:var(--soft); font-size:13px; }
  #down { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px; background:var(--panel); border:1px solid var(--border); border-radius:12px; display:none; text-align:center; z-index:3; }
  #bIndex { display:none; }

  @media (max-width: 900px) {
    #top .sub, #stat, #speed { display:none; }
    #bIndex { display:inline-block; }
    #index { position:absolute; left:0; right:0; bottom:0; width:auto; height:62%; z-index:5; transform:translateY(100%); transition:transform .25s ease; border-top:1px solid var(--border); }
    #index.open { transform:none; }
    #main { position:relative; }
    #legend { left:8px; right:8px; width:auto; }
  }
</style>
</head>
<body>
<div id="top">
  <span class="word">PEZ</span><span class="sub">CI room</span>
  <div id="now"><b>Kitchen sink</b><span>every unit and structure in every state, in the browser build</span></div>
  <span id="stat" class="mono"></span>
  <div id="speed"><button data-s="pause" title="Pause (space)">&#10074;&#10074;</button><button data-s="0.5">&frac12;&times;</button><button data-s="1">1&times;</button><button data-s="2">2&times;</button><button data-s="4">4&times;</button></div>
  <button id="bIndex">Index</button><button id="bPrev" title="Previous ([)">&#9664;</button><button id="bNext" title="Next (])">&#9654;</button><button id="bTour" title="Tour every exhibit (T)">Tour</button><button id="bLegend" title="Legend (L)">Key</button>
</div>
<div id="main">
  <aside id="index">
    <div class="find"><input id="q" placeholder="Find an asset or state" autocomplete="off"><button id="bOverview" title="The whole room">All</button></div>
    <div id="list"></div>
  </aside>
  <div id="view">
    <iframe id="frame" title="Pezz browser view" allow="fullscreen"></iframe>
    <div id="legend"><b>Legend</b><dl id="leg"></dl></div>
    <div id="down"><b>The CI room isn't answering.</b><div style="color:var(--muted)">Run <span class="mono">arena/ci-room.sh open</span> on the host. This page reconnects by itself.</div></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const frame = $('frame');
let cat = null, flat = [], cur = -1, tour = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

// Point the browser build at a camera spot. The first time it loads there (cam=x,y,zoom in its URL); after that the
// camera flies over in the running build (its LookAt hook, by postMessage), with no reload.
let framed = false;
function look(x, y, zoom) {
  const cam = `${x},${y},${zoom}`;
  const w = frame.contentWindow;
  if (framed && w && !w.pezFailed) return w.postMessage({pez: 'look', cam}, location.origin);
  framed = true;
  frame.src = `/watch/web?cam=${cam}` + (new URLSearchParams(location.search).get('camlog') === '1' ? '&camlog=1' : ''); // (camlog: for CI's check)
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  let html = '';
  cat.districts.forEach((d, di) => {
    const items = d.items.map((it, ii) => ({it, i: flat.findIndex(f => f.d === di && f.ii === ii)}))
      .filter(({it}) => !q || (d.name + ' ' + it.name + ' ' + it.states).toLowerCase().includes(q));
    if (q && !items.length && !d.name.toLowerCase().includes(q)) return;
    const hi = flat.findIndex(f => f.d === di && f.ii < 0);
    html += `<div class="dh${cur === hi ? ' cur' : ''}" data-i="${hi}"><b>${esc(d.name)}</b><span>${d.items.length}</span></div>`;
    if (!q) html += `<div class="about">${esc(d.about)}</div>`;
    for (const {it, i} of items) html += `<div class="it${cur === i ? ' cur' : ''}" data-i="${i}"><b>${esc(it.name)}</b><div>${esc(it.states)}</div></div>`;
  });
  $('list').innerHTML = html || '<div style="color:var(--muted);padding:12px">Nothing matches.</div>';
  const L = $('list'), c = L.querySelector('.cur');
  if (c && !q && (c.offsetTop < L.scrollTop || c.offsetTop + c.offsetHeight > L.scrollTop + L.clientHeight)) L.scrollTop = c.offsetTop - 60;
}
$('list').addEventListener('click', e => { const el = e.target.closest('[data-i]'); if (!el) return; stopTour(); go(+el.dataset.i); if (innerWidth <= 900) $('index').classList.remove('open'); });
$('q').addEventListener('input', render);

function go(i) {
  if (!flat.length) return;
  cur = (i + flat.length) % flat.length;
  const f = flat[cur];
  look(f.x, f.y, f.zoom);
  $('now').innerHTML = `<b>${esc(f.ii < 0 ? f.name : `${f.district} / ${f.name}`)}</b><span>${esc(f.states)}</span>`;
  history.replaceState(null, '', '#' + f.slug);
  render();
}
function overview() {
  stopTour(); cur = -1; look(cat.map_size / 2, cat.map_size / 2, 40);
  $('now').innerHTML = '<b>The whole room</b><span>every district at once; pick one from the index, or press Tour</span>'; render();
}
$('bOverview').onclick = overview;
$('bPrev').onclick = () => { stopTour(); go(cur - 1); };
$('bNext').onclick = () => { stopTour(); go(cur + 1); };
function stopTour() { if (tour) { clearInterval(tour); tour = null; $('bTour').classList.remove('on'); } }
$('bTour').onclick = () => { if (tour) return stopTour(); $('bTour').classList.add('on'); go(cur + 1); tour = setInterval(() => go(cur + 1), 9000); };
$('bLegend').onclick = () => { $('legend').classList.toggle('open'); $('bLegend').classList.toggle('on'); };
$('bIndex').onclick = () => $('index').classList.toggle('open');
addEventListener('keydown', e => {
  if (e.target === $('q')) { if (e.key === 'Escape') { $('q').value = ''; render(); $('q').blur(); } return; }
  const k = e.key.toLowerCase();
  if (k === '[') { stopTour(); go(cur - 1); } else if (k === ']') { stopTour(); go(cur + 1); }
  else if (k === 't') $('bTour').onclick(); else if (k === 'l') $('bLegend').onclick();
  else if (k === '/') { e.preventDefault(); $('q').focus(); }
});

async function load() {
  try { cat = await (await fetch('/ci-room/catalog')).json(); if (!cat.districts) throw 0; }
  catch { cat = null; setTimeout(load, 3000); return; }
  flat = [];
  cat.districts.forEach((d, di) => {
    flat.push({d: di, ii: -1, district: d.name, name: d.name, states: d.about, x: d.x, y: d.y, zoom: d.zoom, slug: slug(d.id)});
    d.items.forEach((it, ii) => flat.push({d: di, ii, district: d.name, name: it.name, states: it.states, x: it.x, y: it.y, zoom: it.zoom, slug: slug(d.id + '-' + it.name)}));
  });
  $('leg').innerHTML = cat.legend.map(l => `<dt>${esc(l.term)}</dt><dd>${esc(l.meaning)}</dd>`).join('');
  const want = flat.findIndex(f => '#' + f.slug === location.hash);
  if (want >= 0) go(want); else go(0);
}
load();

let paused = false;
function showSpeed(s) {
  paused = !!s.paused;
  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', b.dataset.s === 'pause' ? s.paused : (!s.paused && Number(b.dataset.s) === s.speed)));
}
async function speed(body) { try { showSpeed(await (await fetch('/ci-room/speed', {method:'POST', body: JSON.stringify(body)})).json()); } catch {} }
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => speed(b.dataset.s === 'pause' ? {paused: !paused} : {speed: Number(b.dataset.s), paused: false}));
async function poll() {
  try {
    const s = await (await fetch('/ci-room/status')).json();
    if (s.error) throw 0;
    $('down').style.display = 'none'; showSpeed(s);
    $('stat').textContent = `${Math.floor(s.time_s / 60)}:${String(Math.floor(s.time_s % 60)).padStart(2, '0')}` + (s.build ? ` · ${s.build}` : '');
    if (!cat) load();
  } catch { $('down').style.display = 'block'; }
}
poll(); setInterval(poll, 4000);
</script>
</body>
</html>
