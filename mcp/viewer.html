<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pezz: your view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The art pack's HUD (design/HUD.dc.html, HUD kit): panels rgba(16,19,23,.9), border #2A3138, radius 12, status never
     uses team hues. Laid out for 1920x1080 and scaled to the window by --k. */
  :root { --bg:#2A2420; --panel:rgba(16,19,23,.9); --border:#2A3138; --line:#3A4047; --btn:#22282E; --ink:#E8EBEE; --cream:#ECE4D2; --muted:#9BA5AE; --soft:#C5CCD2; --amber:#FFA22E; --k:1; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas#c, canvas#live { position:absolute; inset:0; width:100%; height:100%; }
  canvas#c { cursor:grab; } canvas#c:active { cursor:grabbing; }
  #live { object-fit:contain; background:var(--bg); display:none; user-select:none; cursor:grab; }
  body.live #live { display:block; } body.live #c { visibility:hidden; }
  .mono { font-family:"IBM Plex Mono",monospace; }
  .head { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:13px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-sizing:border-box; }
  .hud { position:absolute; zoom:var(--k); }
  .chip { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  .sec { font-family:"IBM Plex Mono",monospace; background:var(--btn); padding:1px 5px; border-radius:4px; }
  button { font:inherit; color:var(--ink); }

  /* Top bar */
  #top { left:16px; top:16px; right:16px; height:60px; display:flex; align-items:center; gap:12px; }
  #brand { height:60px; padding:0 20px; display:flex; align-items:center; gap:16px; }
  #brand .word { font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:24px; letter-spacing:.04em; }
  #brand .rule { width:1px; height:28px; background:var(--border); }
  #clock { font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:500; }
  #where { font-size:14px; color:var(--muted); white-space:nowrap; }
  #teams { flex-grow:1; display:flex; justify-content:center; gap:10px; overflow:hidden; min-width:0; }
  .card { height:60px; padding:0 16px 0 0; display:flex; align-items:center; gap:14px; overflow:hidden; flex:none; }
  .card .stripe { width:8px; align-self:stretch; }
  .card .nm { display:flex; flex-direction:column; gap:2px; }
  .card .nm b { font-weight:600; font-size:16px; } .card .nm span { font-size:13px; color:var(--muted); }
  .card .stat { display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:15px; }
  .card .stat svg { width:16px; height:16px; }
  .card.out { opacity:.45; } .card.out .nm b { text-decoration:line-through; }
  .card.mini { padding-right:14px; } .card.mini .nm b { font-size:14px; }
  #vs { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; color:var(--muted); align-self:center; }
  #modes { height:60px; padding:8px; display:flex; align-items:center; gap:6px; }
  #modes button { min-width:64px; height:44px; border:0; border-radius:8px; background:var(--btn); font-family:"IBM Plex Mono",monospace; font-size:15px; cursor:pointer; }
  #modes button.on { background:var(--cream); color:#101317; font-weight:500; }
  #modes button:disabled { opacity:.35; cursor:default; }
  #modes .rule { width:1px; height:28px; background:var(--border); margin:0 6px; }
  #mode { font-size:14px; color:var(--muted); padding-right:8px; white-space:nowrap; }

  /* Alert banner (HUD kit: CRITICAL hazard chip, HIGH amber, INFO grey) */
  #alert { left:50%; top:92px; transform:translateX(-50%); display:none; align-items:stretch; background:rgba(16,19,23,.92); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; max-width:760px; }
  #alert .tab { width:28px; flex:none; }
  #alert .tab.critical { background:repeating-linear-gradient(135deg,#1E1B1D 0 7px,#ECE4D2 7px 14px); }
  #alert .tab.high { background:var(--amber); } #alert .tab.medium { background:#4A525A; }
  #alert .body { padding:10px 18px; display:flex; align-items:center; gap:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #alert .lvl { font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:14px; letter-spacing:.12em; }
  #alert .more { color:var(--muted); font-size:13px; }

  /* Right column: minimap, then building now / stockpile / standing orders */
  #right { right:16px; top:92px; width:384px; display:flex; flex-direction:column; gap:12px; }
  #mm { padding:12px; } #mm canvas { width:360px; height:360px; display:block; cursor:pointer; }
  #side { padding:16px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; align-items:center; gap:12px; }
  .row img { width:56px; height:42px; border-radius:6px; background:#101317; object-fit:cover; flex:none; }
  .bar { height:6px; border-radius:3px; background:var(--border); } .bar > div { height:6px; border-radius:3px; background:var(--cream); }
  .split { display:flex; justify-content:space-between; font-size:14px; }
  .split .mono { color:var(--muted); }
  #stock { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; font-family:"IBM Plex Mono",monospace; font-size:13px; }
  #stock span { display:flex; justify-content:space-between; color:var(--muted); } #stock b { color:var(--ink); font-weight:500; }
  #orders { font-size:14px; line-height:1.5; color:var(--soft); }
  .note { font-size:13px; color:var(--muted); }

  /* Command feed (bottom-left) */
  #feed { left:16px; bottom:16px; width:560px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  #feedrows { display:grid; grid-template-columns:52px 8px 1fr auto; column-gap:10px; row-gap:10px; align-items:start; font-size:14px; line-height:1.45; max-height:260px; overflow:hidden; }
  #feedrows .t { font-family:"IBM Plex Mono",monospace; color:var(--muted); }
  #feedrows .s { width:8px; height:18px; border-radius:2px; }
  .pill { font-size:12px; border-radius:10px; padding:1px 8px; white-space:nowrap; }
  .pill.done { color:var(--muted); border:1px solid var(--line); } .pill.failed { color:#101317; background:var(--amber); }
  #help { font-size:13px; color:var(--muted); }

  /* Selection card (bottom-centre) */
  #sel { left:600px; bottom:16px; width:520px; padding:14px; display:none; gap:16px; align-items:center; }
  #sel img { width:128px; height:96px; border-radius:8px; background:#101317; object-fit:cover; }
  #sel .big { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:20px; }
  #sel .bar, #sel .bar > div { height:8px; border-radius:4px; }

  /* After this player's game ends */
  #results { left:50%; top:150px; transform:translateX(-50%); display:none; text-align:center; min-width:360px; max-width:560px; padding:16px 20px; }
  #results .big { font-family:"Chakra Petch",sans-serif; font-size:22px; font-weight:700; margin:4px 0 8px; display:flex; gap:10px; align-items:center; justify-content:center; }
  #results .stats { color:var(--muted); }

  /* Narrow windows and phones: brand, alert, minimap and results only */
  @media (max-width: 900px) {
    #teams, #feed, #sel, #side, #modes .rule, #where { display:none; }
    #right { top:auto; bottom:16px; width:auto; }
    #mm canvas { width:200px; height:200px; }
    #alert { top:84px; max-width:92vw; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="live"></canvas>

<div class="hud" id="top">
  <div class="panel" id="brand"><span class="word">PEZ</span><span class="rule"></span><span id="clock">0:00</span><span id="where">Connecting…</span></div>
  <div id="teams"></div>
  <div class="panel" id="modes">
    <button id="bLive" title="Live view (L)">Live</button><button id="bMap" class="on" title="Tactical map (L)">Map</button><button id="bReplay" title="Replay the game so far">Replay</button>
    <span class="rule"></span><span id="mode">Map view</span>
  </div>
</div>
<div class="hud" id="alert"></div>
<div class="hud" id="right">
  <div class="panel" id="mm"><canvas id="mini" width="720" height="720"></canvas></div>
  <div class="panel" id="side">
    <div id="prodbox"><div class="head" style="margin-bottom:10px">Building now</div><div id="prod" style="display:flex;flex-direction:column;gap:10px"></div></div>
    <div><div class="head" style="margin-bottom:8px">Stockpile</div><div id="stock"></div></div>
    <div><div class="head" style="margin-bottom:8px">Standing orders</div><div id="orders"></div>
      <div id="orderEdit" style="display:none;flex-direction:column;gap:8px;margin-top:10px">
        <label for="orderText" class="note">New orders for your agent (they interrupt whatever it's waiting on)</label>
        <textarea id="orderText" maxlength="600" style="height:72px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#101317;color:var(--ink);font:14px 'IBM Plex Sans',sans-serif;resize:none"></textarea>
        <div style="display:flex;gap:8px">
          <button id="orderSend" style="flex-grow:1;height:44px;border:0;border-radius:8px;background:var(--cream);color:#101317;font-weight:600;cursor:pointer">Send</button>
          <button id="orderClear" style="flex-grow:1;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer">Clear</button>
        </div>
        <span id="orderNote" class="note"></span>
      </div>
    </div>
  </div>
</div>
<div class="hud panel" id="feed">
  <div class="split" style="align-items:baseline"><div class="head" id="feedtitle">Command feed</div><span id="help">L live / map · F base · M whole map</span></div>
  <div id="feedrows"></div>
</div>
<div class="hud panel" id="sel"></div>
<div class="hud panel" id="results"></div>
<div class="hud panel" id="replaybar" style="left:50%;bottom:16px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:10px 14px;width:720px">
  <button id="rpPlay" style="width:44px;height:36px;border:0;border-radius:8px;background:var(--cream);color:#101317;font-weight:600;cursor:pointer">❚❚</button>
  <select id="rpSpeed" style="height:36px;border-radius:8px;background:var(--btn);color:var(--ink);border:1px solid var(--line);font-family:'IBM Plex Mono',monospace">
    <option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="120">120×</option></select>
  <input id="rpScrub" type="range" min="0" max="1000" value="0" style="flex-grow:1">
  <span id="rpTime" class="mono note" style="width:120px;text-align:right">0:00</span>
  <button id="rpExit" style="height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;padding:0 12px">Exit replay</button>
</div>

<script>
const BASE = "__BASE__"; // /view/<token> for a player's own fogged view, /watch for the delayed public spectator view
const FLAVORS = ["#2E73FF", "#F22E1F", "#33D94D", "#FFD126", "#8E44D9", "#3A2F9E", "#0F8C8A", "#8E1B4A"];
const TERRAIN = { g: "#7D6E55", d: "#7A6B53", r: "#4A3F40", w: "#3A2218" };
const ORE = { i: "#8A3A24", c: "#C8742F", x: "#8FE4FF", u: "#B6FF3B" };
const AIR = new Set(["gunship", "stealth_bomber", "recon_drone", "transport_chopper"]);
const DEEP = ["#8A3A24", "#C8742F", "#8FE4FF", "#B6FF3B"]; // deep deposits by ore type: iron, copper, crystal, uranium
const ICON = {
  power: '<svg viewBox="0 0 16 16"><path d="M9 1 L3 9 H8 L7 15 L13 7 H8 Z" fill="none" stroke="#ECE4D2" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  steel: '<svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="7" rx="3" fill="none" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
  units: '<svg viewBox="0 0 16 16"><rect x="3" y="6" width="10" height="7" rx="2" fill="none" stroke="#ECE4D2" stroke-width="1.5"/><rect x="5.5" y="3" width="5" height="4" rx="1.5" fill="none" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
  kills: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="#ECE4D2" stroke-width="1.5"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
};
const SPECTATOR = !BASE.startsWith("/view/");
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mini = document.getElementById("mini"), mctx = mini.getContext("2d");
let map = null, frame = null, mapVersion = -1, terrainCanvas = null, shroudCanvas = document.createElement("canvas");
let cam = { x: 40, y: 40, scale: 8 }, fitted = false, selected = 0;
const pretty = (k) => String(k).replaceAll("_", " ").replace(/^./, (c) => c.toUpperCase());
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const num = (n) => Number(n).toLocaleString("en-US");
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
const icons = {};
function icon(key) {
  if (!(key in icons)) { const im = new Image(); im.src = `/icons/${key}.png`; icons[key] = im; im.onerror = () => (icons[key] = null); }
  return icons[key] && icons[key].complete && icons[key].naturalWidth ? icons[key] : null;
}
// Scale the 1920x1080 layout to the window.
function fit() { document.documentElement.style.setProperty("--k", Math.max(0.55, Math.min(1.2, Math.min(innerWidth / 1920, innerHeight / 1000))).toFixed(3)); }
addEventListener("resize", fit); fit();

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }

async function loadMap(data) {
  map = data ?? await getJSON(`${BASE}/map`);
  mapVersion = map.version;
  terrainCanvas = document.createElement("canvas");
  terrainCanvas.width = map.w; terrainCanvas.height = map.h;
  const t = terrainCanvas.getContext("2d"), img = t.createImageData(map.w, map.h);
  for (let y = 0; y < map.h; y++)
    for (let x = 0; x < map.w; x++) {
      const i = y * map.w + x, o = map.ore[i];
      const hex = o !== "." ? ORE[o] : TERRAIN[map.tiles[i]];
      const p = ((map.h - 1 - y) * map.w + x) * 4; // north up
      img.data[p] = parseInt(hex.slice(1, 3), 16); img.data[p + 1] = parseInt(hex.slice(3, 5), 16); img.data[p + 2] = parseInt(hex.slice(5, 7), 16); img.data[p + 3] = 255;
      if (o !== ".") { img.data[p] = (img.data[p] + 125) / 2; img.data[p + 1] = (img.data[p + 1] + 110) / 2; img.data[p + 2] = (img.data[p + 2] + 85) / 2; }
    }
  t.putImageData(img, 0, 0);
  shroudCanvas.width = map.w; shroudCanvas.height = map.h;
  if (!fitted) fitAll();
}

function fitAll() { if (!map) return; cam.x = map.w / 2; cam.y = map.h / 2; cam.scale = Math.min(cv.width / map.w, cv.height / map.h) * 0.92; fitted = true; }
function focusBase() {
  if (!frame?.you) return fitAll();
  const hq = frame.entities.find((e) => e[2] === frame.you.team && e[1] === "command_center") || frame.entities.find((e) => e[2] === frame.you.team);
  if (hq) { cam.x = hq[3]; cam.y = hq[4]; cam.scale = Math.max(cam.scale, 14); }
}
function lookAt(x, y) {
  if (liveMode) fetch(`${BASE}/cam?x=${x}&y=${y}`);
  else { cam.x = x + 0.5; cam.y = y + 0.5; cam.scale = Math.max(cam.scale, 14); }
}

async function tick() {
  if (replay) { setTimeout(tick, 500); return; } // replay owns the picture
  try {
    const prev = frame;
    frame = await getJSON(`${BASE}/frame`);
    showResults(frame.results, frame.rejoin);
    noteVanished(prev, frame);
    if (frame.waiting) { document.getElementById("where").textContent = frame.waiting; setTimeout(tick, 2000); return; }
    if (!map || frame.version !== mapVersion) await loadMap();
    if (frame.shroud) {
      const s = shroudCanvas.getContext("2d"), img = s.createImageData(map.w, map.h);
      for (let y = 0; y < map.h; y++)
        for (let x = 0; x < map.w; x++) {
          const v = frame.shroud[y * map.w + x], p = ((map.h - 1 - y) * map.w + x) * 4;
          img.data[p] = 30; img.data[p + 1] = 27; img.data[p + 2] = 29; img.data[p + 3] = v === "2" ? 0 : v === "1" ? 120 : 238; // licorice
        }
      s.putImageData(img, 0, 0);
    }
    hud();
  } catch (e) {
    document.getElementById("where").textContent = `Not connected: ${e.message}`;
  }
  setTimeout(tick, 250);
}

// Keys typed into a text box are text, not shortcuts.
addEventListener("keydown", (e) => { if (/^(TEXTAREA|INPUT)$/.test(e.target?.tagName ?? "") && e.key !== "Escape") e.stopImmediatePropagation(); }, true);

// ---- Commander link: the watch page plus ?c=<code> lets this player's human redirect their agent at any moment.
const COMMANDER = new URLSearchParams(location.search).get("c");
if (COMMANDER && !SPECTATOR) {
  document.getElementById("orderEdit").style.display = "flex";
  const note = (t) => (document.getElementById("orderNote").textContent = t);
  async function sendOrders(text) {
    note("Sending…");
    try {
      const r = await fetch(`${BASE}/orders`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ c: COMMANDER, text }) });
      const j = await r.json();
      note(r.ok ? (text ? "Sent: your agent gets them right away, even mid-wait." : "Cleared: your agent uses its own judgment.") : `Not sent: ${j.error}`);
      if (r.ok && text) document.getElementById("orderText").value = "";
    } catch (e) { note(`Not sent: ${e.message}`); }
  }
  document.getElementById("orderSend").addEventListener("click", () => { const t = document.getElementById("orderText").value.trim(); if (t) sendOrders(t); });
  document.getElementById("orderClear").addEventListener("click", () => sendOrders(""));
}

// ---- Replay: the game so far (up to the public delay), whole map, at 10-120x.
let replay = null;
async function startReplay() {
  try {
    const r = await getJSON(`${BASE}/replay`);
    if (!r.frames?.length) { document.getElementById("where").textContent = "No replay yet: the recording starts when the game does."; return; }
    if (liveMode) setMode(false);
    replay = { frames: r.frames, t: r.frames[0].t, speed: 30, playing: true, version: -1, last: performance.now() };
    deselect();
    document.getElementById("results").style.display = "none";
    document.getElementById("replaybar").style.display = "flex";
    document.getElementById("bReplay").classList.add("on");
    fitted = false;
  } catch (e) { document.getElementById("where").textContent = `Replay unavailable: ${e.message}`; }
}
function stopReplay() {
  replay = null; frame = null; mapVersion = -1; fitted = false;
  document.getElementById("replaybar").style.display = "none";
  document.getElementById("bReplay").classList.remove("on");
}
async function replayStep() {
  if (!replay) return;
  const now = performance.now(), fr = replay.frames;
  if (replay.playing) replay.t += (now - replay.last) / 1000 * replay.speed;
  replay.last = now;
  const end = fr[fr.length - 1].t;
  if (replay.t >= end) { replay.t = end; replay.playing = false; }
  let i = 0; while (i + 1 < fr.length && fr[i + 1].t <= replay.t) i++;
  const f = fr[i];
  if (f.v !== replay.version && !replay.loading) {
    replay.loading = true;
    try { await loadMap(await getJSON(`${BASE}/replay/map/${f.v}`)); replay.version = f.v; } catch {}
    replay.loading = false;
  }
  frame = { time_s: f.t, version: f.v, teams: f.teams.map(([id, flavor, player, status, kills]) => ({ id, flavor, player, status, kills })),
            entities: f.e, effects: [], chat: [], alerts: [], deposits: [] };
  hud();
  document.getElementById("where").textContent = `Replay · ${clock(f.t)} of ${clock(end)} · whole map`;
  document.getElementById("rpTime").textContent = `${clock(f.t)} / ${clock(end)}`;
  document.getElementById("rpPlay").textContent = replay.playing ? "❚❚" : "▶";
  if (!scrubbing) document.getElementById("rpScrub").value = Math.round(1000 * (f.t - fr[0].t) / Math.max(1, end - fr[0].t));
}
let scrubbing = false;
setInterval(replayStep, 100);
document.getElementById("bReplay").addEventListener("click", () => replay ? stopReplay() : startReplay());
document.getElementById("rpExit").addEventListener("click", stopReplay);
document.getElementById("rpPlay").addEventListener("click", () => { if (!replay) return; if (replay.t >= replay.frames[replay.frames.length - 1].t) replay.t = replay.frames[0].t; replay.playing = !replay.playing; });
document.getElementById("rpSpeed").addEventListener("change", (e) => { if (replay) replay.speed = Number(e.target.value); });
const scrub = document.getElementById("rpScrub");
scrub.addEventListener("input", () => { scrubbing = true; if (!replay) return; const fr = replay.frames; replay.t = fr[0].t + (fr[fr.length - 1].t - fr[0].t) * scrub.value / 1000; });
scrub.addEventListener("change", () => (scrubbing = false));

// ---- HUD panels
function hud() {
  const you = frame.you;
  const playing = frame.teams.filter((t) => t.status === "playing").length;
  document.getElementById("clock").textContent = clock(frame.time_s);
  document.getElementById("where").textContent = `${SPECTATOR || frame.results ? `Spectating${frame.delay_s ? ` · ${frame.delay_s}s delay` : ""}` : `${you?.flavor ?? ""}`} · ${playing} playing${map ? ` · ${map.w}×${map.h}` : ""}`;
  teamCards(you);
  alertBanner();
  sidePanel(you);
  if (!SPECTATOR && !frame.results) feedPanel(); else chatPanel();
  selectionCard();
}

function teamCards(you) {
  const el = document.getElementById("teams");
  const cards = [];
  const stat = (k, v) => `<div class="stat">${ICON[k]}${v}</div>`;
  const ordered = you ? [frame.teams.find((t) => t.id === you.team), ...frame.teams.filter((t) => t.id !== you.team)].filter(Boolean) : frame.teams;
  ordered.forEach((t, i) => {
    const mine = you && t.id === you.team;
    const full = mine || (SPECTATOR && t.units != null && frame.teams.length <= 4);
    const stats = mine
      ? stat("power", you.power_used != null ? `${you.power_used}/${you.power_produced}` : String(you.power ?? "?"))
        + stat("steel", num(you.steel ?? parseInt(you.stockpile?.steel ?? "0", 10) ?? 0)) + (you.units != null ? stat("units", you.units) : "")
      : full ? stat("power", t.power) + stat("steel", num(t.steel)) + stat("units", t.units) : stat("kills", t.kills);
    cards.push(`<div class="panel card ${full ? "" : "mini"} ${t.status !== "playing" ? "out" : ""}"><span class="stripe" style="background:${FLAVORS[t.id % 8]}"></span>` +
      `<div class="nm"><b>${esc(t.flavor)}</b><span>${esc(t.player ?? "")}</span></div>${stats}</div>`);
    if (mine && ordered.length > 1) cards.push(`<span id="vs">VS</span>`);
  });
  el.innerHTML = cards.join("");
}

// Details for the selected unit come from the game (fog-aware: everything about yours, what's visible of an enemy's).

}

// Selecting a mobile unit makes the view (and the live stream's camera) follow it until it's deselected.

addEventListener("keydown", (e) => { if (e.key === "Escape") deselect(); });

}

// ---- Minimap: north up, sectors A-H x 1-8, your view box; click to look there.
function drawMini() {
  const W = mini.width, pad = 40, S = W - pad;
  mctx.fillStyle = "#101317"; mctx.fillRect(0, 0, W, W);
  if (!map || !frame) return;
  const k = S / Math.max(map.w, map.h), ox = pad, oy = pad;
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(terrainCanvas, ox, oy, map.w * k, map.h * k);
  if (frame.shroud) { mctx.imageSmoothingEnabled = true; mctx.drawImage(shroudCanvas, ox, oy, map.w * k, map.h * k); }
  for (const e of frame.entities) {
    const [, key, team, x, y, , , , size] = e;
    if (key === "mine") continue;
    mctx.fillStyle = FLAVORS[team % 8];
    const r = size > 0 ? Math.max(5, size * k) : 5;
    mctx.fillRect(ox + x * k - r / 2, oy + (map.h - y) * k - r / 2, r, r);
  }
  for (const [x, y, type, pct] of frame.deposits ?? []) {
    mctx.strokeStyle = DEEP[type] ?? "#ECE4D2"; mctx.globalAlpha = pct > 0 ? 1 : 0.4; mctx.lineWidth = 3;
    mctx.beginPath(); mctx.arc(ox + x * k, oy + (map.h - y) * k, 8, 0, Math.PI * 2); mctx.stroke(); mctx.globalAlpha = 1;
  }
  mctx.strokeStyle = "#3A4047"; mctx.lineWidth = 2; mctx.strokeRect(ox, oy, map.w * k, map.h * k);
  mctx.fillStyle = "#9BA5AE"; mctx.font = "20px 'IBM Plex Mono', monospace"; mctx.textAlign = "center";
  for (let i = 0; i < 8; i++) {
    mctx.fillText("ABCDEFGH"[i], ox + (i + 0.5) * map.w * k / 8, 26);
    mctx.fillText(String(i + 1), 18, oy + (i + 0.5) * map.h * k / 8 + 7);
  }
  if (!liveMode) {
    // The map view's visible area.
    const x0 = cam.x - cv.width / 2 / cam.scale, x1 = cam.x + cv.width / 2 / cam.scale, y0 = cam.y - cv.height / 2 / cam.scale, y1 = cam.y + cv.height / 2 / cam.scale;
    const cx0 = Math.max(0, x0), cx1 = Math.min(map.w, x1), cy0 = Math.max(0, y0), cy1 = Math.min(map.h, y1);
    if (cx1 > cx0 && cy1 > cy0) {
      mctx.strokeStyle = "#ECE4D2"; mctx.lineWidth = 3;
      mctx.strokeRect(ox + cx0 * k, oy + (map.h - cy1) * k, (cx1 - cx0) * k, (cy1 - cy0) * k);
    }
  }
}
mini.addEventListener("click", (ev) => {
  if (!map) return;
  const r = mini.getBoundingClientRect(), W = mini.width, pad = 40, k = (W - pad) / Math.max(map.w, map.h);
  const px = (ev.clientX - r.left) / r.width * W, py = (ev.clientY - r.top) / r.height * W;
  const x = Math.round((px - pad) / k), y = Math.round(map.h - (py - pad) / k);
  if (x >= 0 && y >= 0 && x < map.w && y < map.h) lookAt(x, y);
});

// ---- Tactical map (World x east, y north -> screen)
const sx = (x) => cv.width / 2 + (x - cam.x) * cam.scale;
const sy = (y) => cv.height / 2 - (y - cam.y) * cam.scale;

const seenFx = new Set(), bursts = [], ghosts = [];
// A unit that leaves the picture (boarding, slipping into fog, salvage, a death whose burst fell between polls)
// fades and shrinks where it was last seen instead of blinking away.
function noteVanished(prev, next) {
  if (!prev?.entities || !next?.entities) return;
  const ids = new Set(next.entities.map((e) => e[0])), t = performance.now();
  for (const e of prev.entities) if (e[8] === 0 && !ids.has(e[0])) ghosts.push({ e, t });
  while (ghosts.length > 200) ghosts.shift();
}
function draw() {
  requestAnimationFrame(draw);
  const dpr = devicePixelRatio || 1;
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; if (!fitted) fitAll(); }
  drawMini();
  ctx.fillStyle = "#2A2420"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!map || !frame) return;
  const fol = selected && frame.entities.find((x) => x[0] === selected && x[8] === 0);
  if (fol && !drag?.moved) { cam.x += (fol[3] - cam.x) * 0.15; cam.y += (fol[4] - cam.y) * 0.15; } // ride along with the selected unit
  const s = cam.scale;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(terrainCanvas, sx(0), sy(map.h), map.w * s, map.h * s);
  ctx.strokeStyle = "rgba(236,228,210,.06)"; ctx.lineWidth = 1;
  ctx.fillStyle = "rgba(236,228,210,.45)"; ctx.font = `${Math.max(10, s * 1.2)}px "IBM Plex Mono", monospace`;
  for (let i = 0; i <= 8; i++) {
    const gx = sx(i * map.w / 8), gy = sy(i * map.h / 8);
    ctx.beginPath(); ctx.moveTo(gx, sy(0)); ctx.lineTo(gx, sy(map.h)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(0), gy); ctx.lineTo(sx(map.w), gy); ctx.stroke();
    if (i < 8) { ctx.fillText("ABCDEFGH"[i], gx + 4, sy(map.h) + 14); ctx.fillText(String(8 - i), sx(0) + 4, gy - 4); }
  }
  // Surveyed deep deposits: a tinted ring with what's left.
  for (const [x, y, type, pct] of frame.deposits ?? []) {
    ctx.strokeStyle = DEEP[type] ?? "#ECE4D2"; ctx.globalAlpha = pct > 0 ? 0.9 : 0.35; ctx.lineWidth = Math.max(1.5, s * 0.12);
    ctx.setLineDash([Math.max(2, s * 0.3), Math.max(2, s * 0.2)]);
    ctx.beginPath(); ctx.arc(sx(x), sy(y), Math.max(5, s * 1.6), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    if (s > 7) { ctx.fillStyle = "#ECE4D2"; ctx.font = `${Math.max(9, s * 0.8)}px "IBM Plex Mono", monospace`; ctx.fillText(`${pct}%`, sx(x) - s * 0.7, sy(y) + s * 0.3); }
    ctx.globalAlpha = 1;
  }
  const ents = frame.entities;
  for (const e of ents) if (e[8] > 0) drawStructure(e, s);
  for (const e of ents) if (e[8] === 0 && !AIR.has(e[1])) drawUnit(e, s);
  for (const e of ents) if (AIR.has(e[1])) drawUnit(e, s, true);
  for (const f of frame.effects) {
    const [seq, type, x, y, x2, y2] = f;
    if (type === "shot") { ctx.strokeStyle = "rgba(255,226,140,.8)"; ctx.lineWidth = Math.max(1, s * 0.06); ctx.beginPath(); ctx.moveTo(sx(x), sy(y)); ctx.lineTo(sx(x2), sy(y2)); ctx.stroke(); }
    if ((type === "hit" || type === "destroyed") && !seenFx.has(seq)) { seenFx.add(seq); bursts.push({ x, y, t: performance.now(), big: type === "destroyed" }); }
  }
  const now = performance.now();
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], k = (now - b.t) / (b.big ? 900 : 450);
    if (k >= 1) { bursts.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,${140 + 80 * (1 - k)},60,${0.8 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), s * (b.big ? 1.6 : 0.6) * (0.4 + k), 0, Math.PI * 2); ctx.fill();
  }
  if (seenFx.size > 4000) seenFx.clear();
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const k = (now - ghosts[i].t) / 700;
    if (k >= 1) { ghosts.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - k; drawUnit(ghosts[i].e, s * (1 - 0.6 * k), AIR.has(ghosts[i].e[1])); ctx.globalAlpha = 1;
  }
  if (frame.shroud) { ctx.imageSmoothingEnabled = true; ctx.drawImage(shroudCanvas, sx(0), sy(map.h), map.w * s, map.h * s); }
  // Selection: cream dashed ring for every team (HUD kit).
  const sel = selected && ents.find((e) => e[0] === selected);
  if (sel) {
    const r = sel[8] > 0 ? sel[8] * s * 0.75 : Math.max(6, s * 0.6);
    ctx.setLineDash([Math.max(3, s * 0.25), Math.max(3, s * 0.2)]); ctx.strokeStyle = "#ECE4D2"; ctx.lineWidth = Math.max(1.5, s * 0.08);
    ctx.beginPath(); ctx.arc(sx(sel[3]), sy(sel[4]), r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawStructure(e, s) {
  const [, key, team, x, y, hp, , build, size] = e;
  const half = size / 2, px = sx(x - half), py = sy(y + half), w = size * s;
  ctx.globalAlpha = build < 100 ? 0.55 : 1;
  ctx.fillStyle = "#ECE4D2"; ctx.fillRect(px, py, w, w);
  ctx.fillStyle = FLAVORS[team % 8]; ctx.fillRect(px, py, w, Math.max(3, w * 0.18));
  ctx.strokeStyle = "#1E1B1D"; ctx.lineWidth = Math.max(1, s * 0.08); ctx.strokeRect(px, py, w, w);
  const im = icon(key);
  if (im && w > 18) ctx.drawImage(im, px + w * 0.1, py + w * 0.22, w * 0.8, w * 0.6);
  ctx.globalAlpha = 1;
  if (build < 100) bar(px, py + w + 2, w, build / 100, "#FFA22E");
  else if (hp < 100) hpBar(px, py + w + 2, w, hp);
}

function drawUnit(e, s, air) {
  const [, key, team, x, y, hp, facing] = e;
  const r = Math.max(2.5, s * (key === "mine" ? 0.18 : 0.32)), px = sx(x), py = sy(y);
  if (air) { ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(px + s * 0.6, py + s * 0.9, r, r * 0.6, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = FLAVORS[team % 8]; ctx.strokeStyle = "#1E1B1D"; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.beginPath();
  if (air) { ctx.moveTo(px, py - r * 1.3); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r * 1.3); ctx.lineTo(px - r, py); ctx.closePath(); }
  else ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#ECE4D2"; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(facing) * r * 1.4, py - Math.sin(facing) * r * 1.4); ctx.stroke();
  if (hp < 100 && s > 6) hpBar(px - r, py + r + 2, r * 2, hp);
  const fuel = e[9];
  if (fuel >= 0 && fuel < 100 && s > 6) bar(px - r, py + r + (hp < 100 ? 6 : 2), r * 2, fuel / 100, fuel < 30 ? "#FFA22E" : "#8FE4FF");
}

// Health in the art pack's status colours: cream, amber below 50%, hazard stripe below 25% (never team colours).
function hpBar(x, y, w, hp) {
  if (hp >= 25) return bar(x, y, w, hp / 100, hp >= 50 ? "#ECE4D2" : "#FFA22E");
  bar(x, y, w, hp / 100, "#ECE4D2");
  ctx.fillStyle = "#1E1B1D";
  for (let k = 0; k < w * hp / 100; k += 4) ctx.fillRect(x + k, y, 2, 3);
}
function bar(x, y, w, f, color) { ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y, w, 3); ctx.fillStyle = color; ctx.fillRect(x, y, w * f, 3); }

// Pan, zoom and pick on the tactical map.
let drag = null;
cv.addEventListener("mousedown", (e) => (drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }));
addEventListener("mouseup", (e) => {
  if (drag && !drag.moved && e.target === cv && frame) {
    const d = devicePixelRatio || 1, wx = cam.x + (e.clientX * d - cv.width / 2) / cam.scale, wy = cam.y - (e.clientY * d - cv.height / 2) / cam.scale;
    let best = 0, bd = 1.6;
    for (const en of frame.entities) { const dd = Math.hypot(en[3] - wx, en[4] - wy) - (en[8] > 0 ? en[8] / 2 : 0); if (dd < bd) { bd = dd; best = en[0]; } }
    if (best) select(best); else deselect();
  }
  drag = null;
});
addEventListener("mousemove", (e) => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
  const d = devicePixelRatio || 1; cam.x = drag.cx - (e.clientX - drag.x) * d / cam.scale; cam.y = drag.cy + (e.clientY - drag.y) * d / cam.scale;
});
cv.addEventListener("wheel", (e) => { e.preventDefault(); cam.scale = Math.max(2, Math.min(60, cam.scale * (e.deltaY < 0 ? 1.12 : 0.89))); }, { passive: false });
document.getElementById("alert").addEventListener("click", (e) => { const d = e.currentTarget.dataset; if (d.x && d.x !== "NaN") lookAt(Number(d.x), Number(d.y)); });
document.getElementById("bLive").addEventListener("click", () => setMode(true));
document.getElementById("bMap").addEventListener("click", () => setMode(false));
addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") focusBase(); if (e.key === "m" || e.key === "M") fitAll(); });
// High-res live stream of this player's own view, rendered by the game host (when it has a renderer). It arrives as
// MJPEG at up to 60fps over one long request; frames are decoded off the main thread, and any that arrive while the
// previous one is still decoding are skipped, so a slow device shows fewer frames rather than falling behind.
const liveImg = document.getElementById("live"), liveCtx = liveImg.getContext("2d");
let liveTotal = 0, noPush = false;
let liveOk = false, liveMode = false, liveFails = 0, liveAbort = null, liveFps = 0, liveShown = 0;
function setMode(live) {
  liveMode = live && liveOk;
  document.body.classList.toggle("live", liveMode);
  document.getElementById("mode").textContent = liveMode ? `Live${liveFps ? ` · ${liveFps} fps` : ""}` : liveOk ? "Map view" : SPECTATOR ? "Spectator map" : "Map view (no live video yet)";
  document.getElementById("bLive").classList.toggle("on", liveMode);
  document.getElementById("bMap").classList.toggle("on", !liveMode);
  document.getElementById("bLive").disabled = !liveOk;
  if (!liveWanted()) liveAbort?.abort(); // don't pull video nobody is looking at
}
setInterval(() => { liveFps = liveShown; liveShown = 0; if (liveMode) setMode(true); }, 1000);
function liveWanted() { return !document.hidden && (liveMode || !liveOk); }
document.addEventListener("visibilitychange", () => { if (!liveWanted()) liveAbort?.abort(); });
async function liveLoop() {
  if (!BASE.startsWith("/view/")) return; // the public spectator page has no personal stream
  if (!liveWanted()) return setTimeout(liveLoop, 250);
  liveAbort = new AbortController();
  try {
    const r = await fetch(`${BASE}/live.mjpg`, { cache: "no-store", signal: liveAbort.signal });
    if (r.ok) {
      liveFails = 0;
      // If no frame shows up soon, this browser isn't getting the stream: fall back to stills.
      const shownBefore = liveTotal, ab = liveAbort;
      const watchdog = setTimeout(() => { if (liveTotal === shownBefore) { noPush = true; ab.abort(); } }, 4000);
      try { await readFrames(r.body.getReader()); } finally { clearTimeout(watchdog); }
    }
    else if (++liveFails > 3) return pollLoop(); // no push stream for us right now: poll stills instead
  } catch {
    if (noPush) return pollLoop();
    if (liveAbort.signal.aborted) return setTimeout(liveLoop, 0);
    liveFails++;
  }
  setTimeout(liveLoop, 1000); // the stream ended (the game restarted, the seat emptied): reconnect
}
// Fallback for hosts without the push stream: fetch one still at a time, as fast as they come.
async function pollLoop() {
  let misses = 0;
  const started = Date.now();
  for (;;) {
    if (!noPush && Date.now() - started > 30000) { liveFails = 0; return liveLoop(); } // try the push stream again
    if (!liveWanted()) { await new Promise((r) => setTimeout(r, 250)); continue; }
    try {
      const r = await fetch(`${BASE}/live.jpg?${Date.now()}`, { cache: "no-store" });
      if (r.ok) { misses = 0; showFrame(new Uint8Array(await r.arrayBuffer())); }
      else if (r.status !== 503 && ++misses > 5) { liveOk = false; setMode(false); await new Promise((r) => setTimeout(r, 15000)); misses = 0; }
    } catch { misses++; }
    await new Promise((r) => setTimeout(r, 60));
  }
}
// The stream is multipart: each part is a few header lines (with Content-Length) and then one JPEG.
async function readFrames(reader) {
  let buf = new Uint8Array(0);
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    const next = new Uint8Array(buf.length + value.length); next.set(buf); next.set(value, buf.length); buf = next;
    for (;;) {
      const end = headerEnd(buf);
      if (end < 0) break;
      const len = Number(/content-length:\s*(\d+)/i.exec(new TextDecoder().decode(buf.subarray(0, end)))?.[1] ?? 0);
      if (buf.length < end + len) break;
      if (len) showFrame(buf.slice(end, end + len));
      buf = buf.subarray(end + len);
    }
  }
}
function headerEnd(b) { for (let i = 3; i < Math.min(b.length, 512); i++) if (b[i] === 10 && b[i - 1] === 13 && b[i - 2] === 10 && b[i - 3] === 13) return i + 1; return -1; }
let nextFrame = null, decoding = false;
async function showFrame(jpg) {
  nextFrame = jpg;
  if (decoding) return;
  decoding = true;
  while (nextFrame) {
    const blob = new Blob([nextFrame], { type: "image/jpeg" }); nextFrame = null;
    try {
      const bmp = await createImageBitmap(blob);
      if (liveImg.width !== bmp.width || liveImg.height !== bmp.height) { liveImg.width = bmp.width; liveImg.height = bmp.height; }
      liveCtx.drawImage(bmp, 0, 0); bmp.close(); liveShown++; liveTotal++;
      if (!liveOk) { liveOk = true; setMode(true); }
    } catch {}
  }
  decoding = false;
}
// In live mode, dragging and scrolling steer the stream's camera (it returns to following the action after 20s).
let camAcc = { dx: 0, dy: 0, zoom: 1, yaw: 0 }, camBusy = false, camDrag = null;
function camFlush() {
  if (camBusy) return; const a = camAcc;
  if (!a.dx && !a.dy && a.zoom === 1 && !a.yaw) return;
  camAcc = { dx: 0, dy: 0, zoom: 1, yaw: 0 }; camBusy = true;
  fetch(`${BASE}/cam?dx=${a.dx.toFixed(4)}&dy=${a.dy.toFixed(4)}&zoom=${a.zoom.toFixed(3)}&yaw=${a.yaw}`).finally(() => { camBusy = false; setTimeout(camFlush, 30); });
}
liveImg.addEventListener("mousedown", (e) => { camDrag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY }; e.preventDefault(); });
addEventListener("mouseup", async (e) => {
  const d = camDrag; camDrag = null;
  if (!d || !liveMode || Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) > 4) return;
  // A click, not a drag: find what's under it in the stream image (letterboxed inside the element).
  const r = liveImg.getBoundingClientRect(), k = Math.min(r.width / liveImg.width, r.height / liveImg.height);
  const ox = (r.width - liveImg.width * k) / 2, oy = (r.height - liveImg.height * k) / 2;
  const u = (e.clientX - r.left - ox) / (liveImg.width * k), v = (e.clientY - r.top - oy) / (liveImg.height * k);
  if (u < 0 || u > 1 || v < 0 || v > 1) return;
  try { const p = await getJSON(`${BASE}/pick?u=${u.toFixed(4)}&v=${v.toFixed(4)}`); if (p.id) select(p.id); else deselect(); } catch {}
});
addEventListener("mousemove", (e) => { if (!camDrag || !liveMode) return; const r = liveImg.getBoundingClientRect(); camAcc.dx -= (e.clientX - camDrag.x) / r.width; camAcc.dy += (e.clientY - camDrag.y) / r.height; camDrag = { x: e.clientX, y: e.clientY }; camFlush(); });
liveImg.addEventListener("wheel", (e) => { e.preventDefault(); camAcc.zoom *= e.deltaY < 0 ? 0.9 : 1.11; camFlush(); }, { passive: false });
addEventListener("keydown", (e) => { if (!liveMode) return; const k = e.key.toLowerCase(); if (k === "q") camAcc.yaw += 15; if (k === "e") camAcc.yaw -= 15; camFlush(); });
addEventListener("keydown", (e) => { if (e.key === "l" || e.key === "L") setMode(!liveMode); });
setMode(false); tick(); draw(); liveLoop();
if (new URLSearchParams(location.search).get("replay") === "1") setTimeout(startReplay, 800); // a shareable replay link
setTimeout(focusBase, 1500);
</script>
