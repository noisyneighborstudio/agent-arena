<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pezz: your view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The art pack's HUD (design/HUD.dc.html, HUD kit): panels rgba(16,19,23,.9), border #2A3138, radius 12, status never
     uses team hues. Laid out for 1920x1080 and scaled to the window by --k. */
  :root { --bg:#2A2420; --panel:rgba(16,19,23,.9); --border:#2A3138; --line:#3A4047; --btn:#22282E; --ink:#E8EBEE; --cream:#ECE4D2; --muted:#9BA5AE; --soft:#C5CCD2; --amber:#FFA22E; --k:1; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas#c, canvas#live { position:absolute; inset:0; width:100%; height:100%; touch-action:none; } /* touch pans and pinches the map, not the page */
  canvas#c { cursor:grab; } canvas#c:active { cursor:grabbing; }
  #live { object-fit:contain; background:var(--bg); display:none; user-select:none; cursor:grab; }
  body.live #live { display:block; } body.live #c { visibility:hidden; }
  body.spectator #live { cursor:default; } /* the spectator camera directs itself */
  .mono { font-family:"IBM Plex Mono",monospace; }
  .head { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:13px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-sizing:border-box; }
  .hud { position:absolute; zoom:var(--k); }
  .chip { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  .sec { font-family:"IBM Plex Mono",monospace; background:var(--btn); padding:1px 5px; border-radius:4px; }
  button { font:inherit; color:var(--ink); }

  /* Top bar */
  #top { left:16px; top:16px; right:16px; height:60px; display:flex; align-items:center; gap:12px; }
  #brand { height:60px; padding:0 20px; display:flex; align-items:center; gap:16px; }
  #brand .word { font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:24px; letter-spacing:.04em; }
  #brand .rule { width:1px; height:28px; background:var(--border); }
  #clock { font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:500; }
  #where { font-size:14px; color:var(--muted); white-space:nowrap; }
  /* Team strip: the player's own card pinned at the left, then everyone else as a ticker that loops when they don't fit
     (static when they do; a plain scroller under prefers-reduced-motion). */
  #teams { flex:1 1 0; display:flex; align-items:center; gap:10px; min-width:0; height:60px; }
  #own { display:flex; align-items:center; gap:10px; flex:none; }
  #own:empty { display:none; }
  #tick { flex:1 1 0; min-width:0; height:60px; overflow:hidden; position:relative; }
  #tick.moving { -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent); mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent); }
  #tick.scroll { overflow-x:auto; scrollbar-width:none; } #tick.scroll::-webkit-scrollbar { display:none; }
  #track { display:flex; height:60px; gap:10px; width:max-content; will-change:transform; }
  #tick.static #track { width:100%; justify-content:center; }
  .set { display:flex; gap:10px; flex:none; }
  .card { height:60px; padding:0 16px 0 0; display:flex; align-items:center; gap:14px; overflow:hidden; flex:none; }
  .card .stripe { width:8px; align-self:stretch; }
  .card .nm { display:flex; flex-direction:column; gap:2px; }
  .card .nm b { font-weight:600; font-size:16px; } .card .nm span { font-size:13px; color:var(--muted); }
  .card .stat { display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:15px; }
  .card .stat svg { width:16px; height:16px; }
  .card.out { opacity:.45; } .card.out .nm b { text-decoration:line-through; }
  .card.mini { padding-right:14px; } .card.mini .nm b { font-size:14px; }
  #vs { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:15px; color:var(--muted); align-self:center; flex:none; }
  #brand, #modes { flex:none; }
  #modes { height:60px; padding:8px; display:flex; align-items:center; gap:6px; box-sizing:border-box; }
  #modes button { min-width:64px; height:44px; padding:0 12px; white-space:nowrap; border:0; border-radius:8px; background:var(--btn); font-family:"IBM Plex Mono",monospace; font-size:15px; cursor:pointer; }
  #modes button.on { background:var(--cream); color:#101317; font-weight:500; }
  #modes button:disabled { opacity:.35; cursor:default; }
  #modes .rule { width:1px; height:28px; background:var(--border); margin:0 6px; }
  #mode { font-size:14px; color:var(--muted); padding-right:8px; white-space:nowrap; }

  /* Alert banner (HUD kit: CRITICAL hazard chip, HIGH amber, INFO grey) */
  #alert { left:50%; top:var(--below,92px); transform:translateX(-50%); display:none; align-items:stretch; background:rgba(16,19,23,.92); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; max-width:760px; }
  #alert .tab { width:28px; flex:none; }
  #alert .tab.critical { background:repeating-linear-gradient(135deg,#1E1B1D 0 7px,#ECE4D2 7px 14px); }
  #alert .tab.high { background:var(--amber); } #alert .tab.medium { background:#4A525A; }
  #alert .body { padding:10px 18px; display:flex; align-items:center; gap:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #alert .lvl { font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:14px; letter-spacing:.12em; }
  #alert .more { color:var(--muted); font-size:13px; }

  /* Right column: minimap, then building now / stockpile / standing orders */
  #right { right:16px; top:var(--below,92px); width:384px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  #right > .panel { width:100%; }
  /* Layout boxes let clicks through to the map and video; only the panels in them take input. */
  #top, #right, #bottom { pointer-events:none; } #top > *, #right > *, #bottom > * { pointer-events:auto; }
  #mm { padding:12px; } #mm canvas { width:360px; height:360px; display:block; cursor:pointer; }
  #side { padding:16px; display:flex; flex-direction:column; gap:14px; }
  /* Drawers: the side panel and the feed/chat collapse to their header; the choice is remembered. */
  .drawerhead { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tog { width:32px; height:28px; flex:none; border:1px solid var(--line); border-radius:7px; background:var(--btn); cursor:pointer; padding:0; display:grid; place-items:center; }
  .tog svg { width:14px; height:14px; transition:transform .15s; }
  .panel.collapsed .tog svg { transform:rotate(-90deg); }
  .panel.collapsed .drawerbody { display:none; }
  .drawerbody { display:flex; flex-direction:column; gap:14px; }
  #side.collapsed, #feed.collapsed { padding-top:10px; padding-bottom:10px; }
  .row { display:flex; align-items:center; gap:12px; }
  .row .glyph { width:56px; height:42px; border-radius:6px; font-size:14px; }
  .row img { width:56px; height:42px; border-radius:6px; background:#101317; object-fit:cover; flex:none; }
  .bar { height:6px; border-radius:3px; background:var(--border); } .bar > div { height:6px; border-radius:3px; background:var(--cream); }
  .split { display:flex; justify-content:space-between; font-size:14px; }
  .split .mono { color:var(--muted); }
  #stock { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; font-family:"IBM Plex Mono",monospace; font-size:13px; }
  #stock span { display:flex; justify-content:space-between; color:var(--muted); } #stock b { color:var(--ink); font-weight:500; }
  #orders { font-size:14px; line-height:1.5; color:var(--soft); }
  .note { font-size:13px; color:var(--muted); }

  /* Command feed (bottom-left) */
  /* Bottom: the command feed (or arena chat) and the selection card, side by side; stacked on narrow windows. */
  #bottom { left:16px; bottom:16px; display:flex; align-items:flex-end; gap:24px; }
  body.replaying #bottom { bottom:84px; }
  #feed { width:560px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-sizing:border-box; }
  #feedrows { display:grid; grid-template-columns:52px 8px 1fr auto; column-gap:10px; row-gap:10px; align-items:start; font-size:14px; line-height:1.45; max-height:260px; overflow:hidden; }
  #feedrows .t { font-family:"IBM Plex Mono",monospace; color:var(--muted); }
  #feedrows .s { width:8px; height:18px; border-radius:2px; }
  .pill { font-size:12px; border-radius:10px; padding:1px 8px; white-space:nowrap; }
  .pill.done { color:var(--muted); border:1px solid var(--line); } .pill.failed { color:#101317; background:var(--amber); }
  #help { font-size:13px; color:var(--muted); }

  /* Selection card (bottom-centre) */
  #sel { width:520px; padding:14px; display:none; gap:16px; align-items:center; box-sizing:border-box; }
  .glyph { display:grid; place-items:center; background:#101317; color:var(--muted); font-family:"Chakra Petch",sans-serif; font-weight:600; letter-spacing:.06em; flex:none; }
  #sel img, #sel .glyph { width:128px; height:96px; border-radius:8px; background:#101317; object-fit:cover; flex:none; font-size:28px; }
  #sel .big { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:20px; }
  #sel .bar, #sel .bar > div { height:8px; border-radius:4px; }

  /* After this player's game ends */
  #results { left:50%; top:calc(var(--below,92px) + 58px); transform:translateX(-50%); display:none; text-align:center; min-width:360px; max-width:560px; padding:16px 20px; }
  #results .big { font-family:"Chakra Petch",sans-serif; font-size:22px; font-weight:700; margin:4px 0 8px; display:flex; gap:10px; align-items:center; justify-content:center; }
  #results .stats { color:var(--muted); }

  /* Narrow windows (under 1100 px; fit() sets the classes and --wl, the window's width in layout px): nothing is
     hidden. The strip keeps its own card and ticker, the minimap and panels shrink, the feed and selection card stack. */
  body.narrow #top { left:8px; right:8px; top:8px; }
  body.narrow #where, body.narrow #mode, body.narrow #modes .rule, body.narrow #help { display:none; }
  body.narrow #brand { padding:0 14px; gap:12px; }
  body.narrow #right { right:8px; width:300px; }
  body.narrow #mm { padding:8px; width:auto; } body.narrow #mm canvas { width:216px; height:216px; }
  body.narrow #bottom { left:8px; bottom:8px; flex-direction:column-reverse; align-items:stretch; gap:8px; width:560px; max-width:calc(var(--wl) - 16px); }
  body.phone #bottom { width:auto; max-width:none; right:8px; }
  body.narrow #feed, body.narrow #sel { width:auto; }
  body.narrow #feedrows { max-height:180px; }
  body.narrow #sel img, body.narrow #sel .glyph { width:96px; height:72px; }
  body.narrow #alert { max-width:calc(var(--wl) - 24px); }
  body.narrow #results { min-width:0; max-width:calc(var(--wl) - 24px); width:max-content; }
  body.narrow #replaybar { left:8px !important; right:8px; width:auto !important; transform:none !important; }
  /* Phones: the strip takes a second row under the clock and the mode buttons. */
  body.phone #top { flex-wrap:wrap; height:auto; row-gap:8px; }
  body.phone #brand { order:1; } body.phone #modes { order:2; margin-left:auto; }
  body.phone #teams { order:3; flex:1 1 100%; }
  body.phone #modes button { min-width:48px; padding:0 10px; font-size:14px; }
  body.phone #own .card .nm span, body.phone #own .card .stat ~ .stat { display:none; }
  body.phone #right { left:8px; right:8px; width:auto; }
  body.phone #side { max-width:384px; }
  body.phone #mm canvas { width:150px; height:150px; }
  body.phone #rpSpeed, body.phone #rpTime { display:none; }
  body.phone #feedrows { max-height:132px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="live"></canvas>

<div class="hud" id="top">
  <div class="panel" id="brand"><span class="word">PEZ</span><span class="rule"></span><span id="clock">0:00</span><span id="where">Connecting…</span></div>
  <div id="teams"><div id="own"></div><div id="tick"><div id="track"><div class="set" id="setA"></div><div class="set" id="setB" aria-hidden="true"></div></div></div></div>
  <div class="panel" id="modes">
    <button id="bLive" title="Live view (L)">Live</button><button id="bMap" class="on" title="Tactical map (L)">Map</button><button id="bReplay" title="Replay the game so far">Replay</button>
    <span class="rule"></span><span id="mode">Map view</span>
  </div>
</div>
<div class="hud" id="alert"></div>
<div class="hud" id="right">
  <div class="panel" id="mm"><canvas id="mini" width="720" height="720"></canvas></div>
  <div class="panel" id="side">
    <div class="drawerhead"><span class="head" id="sidetitle">Your base</span><button class="tog" data-drawer="side" title="Show or hide this panel" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" fill="none" stroke="#ECE4D2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="drawerbody">
    <div id="prodbox"><div class="head" style="margin-bottom:10px">Building now</div><div id="prod" style="display:flex;flex-direction:column;gap:10px"></div></div>
    <div><div class="head" style="margin-bottom:8px">Stockpile</div><div id="stock"></div></div>
    <div><div class="head" style="margin-bottom:8px">Standing orders</div><div id="orders"></div>
      <div id="orderEdit" style="display:none;flex-direction:column;gap:8px;margin-top:10px">
        <label for="orderText" class="note">New orders for your agent (they interrupt whatever it's waiting on)</label>
        <textarea id="orderText" maxlength="600" style="height:72px;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#101317;color:var(--ink);font:14px 'IBM Plex Sans',sans-serif;resize:none"></textarea>
        <div style="display:flex;gap:8px">
          <button id="orderSend" style="flex-grow:1;height:44px;border:0;border-radius:8px;background:var(--cream);color:#101317;font-weight:600;cursor:pointer">Send</button>
          <button id="orderClear" style="flex-grow:1;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer">Clear</button>
        </div>
        <span id="orderNote" class="note"></span>
      </div>
    </div>
    </div>
  </div>
</div>
<div class="hud" id="bottom">
  <div class="panel" id="feed">
    <div class="drawerhead"><div class="head" id="feedtitle">Command feed</div><span id="help" style="margin-left:auto">L live / map · F base · M whole map</span><button class="tog" data-drawer="feed" title="Show or hide this panel" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" fill="none" stroke="#ECE4D2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="drawerbody"><div id="feedrows"></div></div>
  </div>
  <div class="panel" id="sel"></div>
</div>
<div class="hud panel" id="results"></div>
<div class="hud panel" id="replaybar" style="left:50%;bottom:16px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:10px 14px;width:720px">
  <button id="rpPlay" style="width:44px;height:36px;border:0;border-radius:8px;background:var(--cream);color:#101317;font-weight:600;cursor:pointer">❚❚</button>
  <select id="rpSpeed" style="height:36px;border-radius:8px;background:var(--btn);color:var(--ink);border:1px solid var(--line);font-family:'IBM Plex Mono',monospace">
    <option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="120">120×</option></select>
  <input id="rpScrub" type="range" min="0" max="1000" value="0" style="flex-grow:1">
  <span id="rpTime" class="mono note" style="width:120px;text-align:right">0:00</span>
  <button id="rpExit" style="height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;padding:0 12px">Exit replay</button>
</div>

<script>
const BASE = "__BASE__"; // /view/<token> for a player's own fogged view, /watch for the delayed public spectator view
const FLAVORS = ["#2E73FF", "#F22E1F", "#33D94D", "#FFD126", "#8E44D9", "#3A2F9E", "#0F8C8A", "#8E1B4A"];
const TERRAIN = { g: "#7D6E55", d: "#7A6B53", r: "#4A3F40", w: "#3A2218" };
const ORE = { i: "#8A3A24", c: "#C8742F", x: "#8FE4FF", u: "#B6FF3B" };
const AIR = new Set(["gunship", "stealth_bomber", "recon_drone", "long_range_drone", "reaper_drone", "transport_chopper"]);
const DEEP = ["#8A3A24", "#C8742F", "#8FE4FF", "#B6FF3B"]; // deep deposits by ore type: iron, copper, crystal, uranium
const ICON = {
  power: '<svg viewBox="0 0 16 16"><path d="M9 1 L3 9 H8 L7 15 L13 7 H8 Z" fill="none" stroke="#ECE4D2" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  steel: '<svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="7" rx="3" fill="none" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
  units: '<svg viewBox="0 0 16 16"><rect x="3" y="6" width="10" height="7" rx="2" fill="none" stroke="#ECE4D2" stroke-width="1.5"/><rect x="5.5" y="3" width="5" height="4" rx="1.5" fill="none" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
  kills: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="#ECE4D2" stroke-width="1.5"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4" stroke="#ECE4D2" stroke-width="1.5"/></svg>',
};
const SPECTATOR = !BASE.startsWith("/view/");
document.body.classList.toggle("spectator", SPECTATOR);
if (SPECTATOR) { document.getElementById("sidetitle").textContent = "Arena"; document.getElementById("feedtitle").textContent = "Arena chat"; }
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mini = document.getElementById("mini"), mctx = mini.getContext("2d");
let map = null, frame = null, mapVersion = -1, terrainCanvas = null, shroudCanvas = document.createElement("canvas");
let cam = { x: 40, y: 40, scale: 8 }, fitted = false, selected = 0;
const pretty = (k) => String(k).replaceAll("_", " ").replace(/^./, (c) => c.toUpperCase());
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const num = (n) => Number(n).toLocaleString("en-US");
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
// Unit icons. A unit with no icon of its own (a new one the art hasn't caught up with) borrows its closest relative's,
// and failing that shows a lettered glyph; a miss is remembered, so nothing is re-requested every poll.
const ICON_BASE = { long_range_drone: "recon_drone", reaper_drone: "recon_drone", recon_drone: "gunship", transport_chopper: "gunship", mammoth_tank: "heavy_tank", flak_track: "light_tank", apc: "light_tank",
  minelayer: "mining_truck", commando: "rifleman", sniper: "rifleman", engineer: "medic" };
const iconMissing = new Set();
function iconKey(key) {
  for (let k = key, i = 0; k && i < 3; k = ICON_BASE[k], i++) if (!iconMissing.has(k)) return k;
  return null;
}
function noIcon(key, el) { iconMissing.add(key); const k = iconKey(key); if (el && k) el.src = `/icons/${k}.png`; else if (el) el.replaceWith(glyphEl(el.dataset.key || key, el.className)); }
function glyphEl(key, cls) { const d = document.createElement("div"); d.className = `glyph ${cls ?? ""}`; d.textContent = String(key).split("_").map((w) => w[0]).join("").slice(0, 2).toUpperCase(); return d; }
/** An <img> for a unit's icon (or its fallback); `style` sizes it. */
function iconImg(key, style = "") {
  const k = iconKey(key);
  const glyph = String(key).split("_").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  return k ? `<img src="/icons/${k}.png" alt="" data-key="${esc(key)}" style="${style}" onerror="noIcon('${k}', this)">`
           : `<div class="glyph" style="${style}">${esc(glyph)}</div>`;
}
const icons = {};
function icon(key) {
  const k = iconKey(key);
  if (!k) return null;
  if (!(k in icons)) { const im = new Image(); im.src = `/icons/${k}.png`; icons[k] = im; im.onerror = () => { icons[k] = null; iconMissing.add(k); }; }
  return icons[k] && icons[k].complete && icons[k].naturalWidth ? icons[k] : null;
}
// Scale the 1920x1080 layout to the window. Under 1100 px wide the HUD reflows instead of shrinking past legibility
// (body.narrow; body.phone under 640): --wl is the window's width in layout px, --below the top bar's bottom edge.
let K = 1;
function fit() {
  // (A phone's innerWidth grows to fit anything that overflows, so the screen's width caps it.)
  const w = Math.min(innerWidth, screen.width || innerWidth), h = innerHeight, narrow = w < 1100, phone = w < 640;
  K = phone ? 0.85 : narrow ? Math.max(0.78, Math.min(1, w / 1100)) : Math.max(0.62, Math.min(1.2, Math.min(w / 1920, h / 1000)));
  const root = document.documentElement.style;
  root.setProperty("--k", K.toFixed(3));
  root.setProperty("--wl", `${Math.round(w / K)}px`);
  document.body.classList.toggle("narrow", narrow);
  document.body.classList.toggle("phone", phone);
  const top = document.getElementById("top");
  root.setProperty("--below", `${top.offsetTop + top.offsetHeight + (narrow ? 10 : 16)}px`);
  for (const b of document.querySelectorAll(".tog")) applyDrawer(b.dataset.drawer); // defaults follow the width until someone chooses
  liveLabel(); tickerLayout();
}
addEventListener("resize", fit);

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }

async function loadMap(data) {
  map = data ?? await getJSON(`${BASE}/map`);
  mapVersion = map.version;
  terrainCanvas = document.createElement("canvas");
  terrainCanvas.width = map.w; terrainCanvas.height = map.h;
  const t = terrainCanvas.getContext("2d"), img = t.createImageData(map.w, map.h);
  for (let y = 0; y < map.h; y++)
    for (let x = 0; x < map.w; x++) {
      const i = y * map.w + x, o = map.ore[i];
      const hex = o !== "." ? ORE[o] : TERRAIN[map.tiles[i]];
      const p = ((map.h - 1 - y) * map.w + x) * 4; // north up
      img.data[p] = parseInt(hex.slice(1, 3), 16); img.data[p + 1] = parseInt(hex.slice(3, 5), 16); img.data[p + 2] = parseInt(hex.slice(5, 7), 16); img.data[p + 3] = 255;
      if (o !== ".") { img.data[p] = (img.data[p] + 125) / 2; img.data[p + 1] = (img.data[p + 1] + 110) / 2; img.data[p + 2] = (img.data[p + 2] + 85) / 2; }

function fitAll() { if (!map) return; cam.x = map.w / 2; cam.y = map.h / 2; cam.scale = Math.min(cv.width / map.w, cv.height / map.h) * 0.92; fitted = true; }
function focusBase() {

  const hq = frame.entities.find((e) => e[2] === frame.you.team && e[1] === "command_center") || frame.entities.find((e) => e[2] === frame.you.team);
  if (hq) { cam.x = hq[3]; cam.y = hq[4]; cam.scale = Math.max(cam.scale, 14); }
}
function lookAt(x, y) {

  if (liveMode) fetch(`${BASE}/cam?x=${x}&y=${y}`);

async function tick() {
  if (replay) { setTimeout(tick, 500); return; } // replay owns the picture
  try {
    const prev = frame;
    frame = await getJSON(`${BASE}/frame`);
    if (SPECTATOR) spectatorLive(frame.live);
    showResults(frame.results, frame.rejoin);
    noteVanished(prev, frame);
    if (frame.waiting) { document.getElementById("where").textContent = frame.waiting; setTimeout(tick, 2000); return; }
    if (!map || frame.version !== mapVersion) await loadMap();
    if (frame.shroud) {
      const s = shroudCanvas.getContext("2d"), img = s.createImageData(map.w, map.h);
      for (let y = 0; y < map.h; y++)
        for (let x = 0; x < map.w; x++) {
          const v = frame.shroud[y * map.w + x], p = ((map.h - 1 - y) * map.w + x) * 4;
          img.data[p] = 30; img.data[p + 1] = 27; img.data[p + 2] = 29; img.data[p + 3] = v === "2" ? 0 : v === "1" ? 120 : 238; // licorice
        }
      s.putImageData(img, 0, 0);
    }
    hud();
  } catch (e) {
    document.getElementById("where").textContent = `Not connected: ${e.message}`;
  }
  setTimeout(tick, 250);
}

// ---- Replay: the game so far (up to the public delay), whole map, at 10-120x.
let replay = null;
async function startReplay() {
  try {
    const r = await getJSON(`${BASE}/replay`);
    if (!r.frames?.length) { document.getElementById("where").textContent = "No replay yet: the recording starts when the game does."; return; }
    if (liveMode) setMode(false);
    replay = { frames: r.frames, t: r.frames[0].t, speed: 30, playing: true, version: -1, last: performance.now() };
    deselect();
    document.getElementById("results").style.display = "none";
    document.getElementById("replaybar").style.display = "flex";
    document.body.classList.add("replaying");
    document.getElementById("bReplay").classList.add("on");
    fitted = false;
  } catch (e) { document.getElementById("where").textContent = `Replay unavailable: ${e.message}`; }
}
function stopReplay() {
  replay = null; frame = null; mapVersion = -1; fitted = false;
  document.getElementById("replaybar").style.display = "none";
  document.body.classList.remove("replaying");
  document.getElementById("bReplay").classList.remove("on");
}
async function replayStep() {
  if (!replay) return;
  const now = performance.now(), fr = replay.frames;
  if (replay.playing) replay.t += (now - replay.last) / 1000 * replay.speed;
  replay.last = now;
  const end = fr[fr.length - 1].t;
  if (replay.t >= end) { replay.t = end; replay.playing = false; }
  let i = 0; while (i + 1 < fr.length && fr[i + 1].t <= replay.t) i++;
  const f = fr[i];
  if (f.v !== replay.version && !replay.loading) {
    replay.loading = true;
    try { await loadMap(await getJSON(`${BASE}/replay/map/${f.v}`)); replay.version = f.v; } catch {}
    replay.loading = false;
  }
  frame = { time_s: f.t, version: f.v, teams: f.teams.map(([id, flavor, player, status, kills]) => ({ id, flavor, player, status, kills })),
            entities: f.e, effects: [], chat: [], alerts: [], deposits: [] };
  hud();
  document.getElementById("where").textContent = `Replay · ${clock(f.t)} of ${clock(end)} · whole map`;
  document.getElementById("rpTime").textContent = `${clock(f.t)} / ${clock(end)}`;
  document.getElementById("rpPlay").textContent = replay.playing ? "❚❚" : "▶";
  if (!scrubbing) document.getElementById("rpScrub").value = Math.round(1000 * (f.t - fr[0].t) / Math.max(1, end - fr[0].t));
}
let scrubbing = false;
setInterval(replayStep, 100);
document.getElementById("bReplay").addEventListener("click", () => replay ? stopReplay() : startReplay());
document.getElementById("rpExit").addEventListener("click", stopReplay);
document.getElementById("rpPlay").addEventListener("click", () => { if (!replay) return; if (replay.t >= replay.frames[replay.frames.length - 1].t) replay.t = replay.frames[0].t; replay.playing = !replay.playing; });
document.getElementById("rpSpeed").addEventListener("change", (e) => { if (replay) replay.speed = Number(e.target.value); });
const scrub = document.getElementById("rpScrub");
scrub.addEventListener("input", () => { scrubbing = true; if (!replay) return; const fr = replay.frames; replay.t = fr[0].t + (fr[fr.length - 1].t - fr[0].t) * scrub.value / 1000; });
scrub.addEventListener("change", () => (scrubbing = false));

// The team strip. A player's own card is pinned at the left (never clipped or scrolled); everyone else follows a
// "VS" as a ticker tape that loops seamlessly (the list drawn twice) at about 35 px/s, pausing under the pointer or a
// finger. /watch has no own card: every team goes in the ticker. When they all fit, they sit still. Cards update in
// place, so kills and eliminations never restart or jolt the scroll.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const ticker = { off: 0, last: 0, paused: false, setW: 0, moving: false, html: new Map(), ownHtml: "" };
function cardHtml(t, you) {
  const mine = you && t.id === you.team;
  const full = mine || (t.units != null && (SPECTATOR || frame.results));
  const stat = (k, v) => `<div class="stat">${ICON[k]}${v}</div>`;
  const stats = mine
    ? stat("power", you.power_used != null ? `${you.power_used}/${you.power_produced}` : String(you.power ?? "?"))
      + stat("steel", num(you.steel ?? parseInt(you.stockpile?.steel ?? "0", 10) ?? 0)) + (you.units != null ? stat("units", you.units) : "")
    : full ? stat("power", t.power) + stat("steel", num(t.steel)) + stat("units", t.units) + (t.kills != null ? stat("kills", t.kills) : "") : stat("kills", t.kills);
  return { cls: `panel card ${full ? "" : "mini"} ${t.status !== "playing" ? "out" : ""}`,
    html: `<span class="stripe" style="background:${FLAVORS[t.id % 8]}"></span><div class="nm"><b>${esc(t.flavor)}</b><span>${esc(t.player ?? "")}</span></div>${stats}` };
}
function teamCards(you) {
  const own = document.getElementById("own"), A = document.getElementById("setA"), B = document.getElementById("setB");
  const mineT = you && frame.teams.find((t) => t.id === you.team);
  // Pinned own card.
  let ownHtml = "";
  if (mineT) { const c = cardHtml(mineT, you); ownHtml = `<div class="${c.cls}">${c.html}</div>` + (frame.teams.length > 1 ? `<span id="vs">VS</span>` : ""); }
  let changed = false;
  if (ownHtml !== ticker.ownHtml) { own.innerHTML = ticker.ownHtml = ownHtml; changed = true; }
  // The ticker's cards, keyed by team, touched only when their content changes.
  const others = frame.teams.filter((t) => !mineT || t.id !== mineT.id);
  const ids = others.map((t) => String(t.id));
  if (ids.join() !== [...A.children].map((c) => c.dataset.id).join()) {
    A.innerHTML = ids.map((id) => `<div data-id="${id}"></div>`).join(""); ticker.html.clear(); changed = true;
  }
  others.forEach((t, i) => {
    const c = cardHtml(t, you), key = c.cls + c.html;
    if (ticker.html.get(t.id) === key) return;
    ticker.html.set(t.id, key);
    const el = A.children[i]; el.className = c.cls; el.innerHTML = c.html; changed = true;
  });
  if (changed) { B.innerHTML = A.innerHTML; fit(); } // fit() re-measures the bar (a phone's wraps) and the ticker
}
function tickerLayout() {
  const tick = document.getElementById("tick"), A = document.getElementById("setA"), B = document.getElementById("setB"), track = document.getElementById("track");
  if (!tick) return;
  const fits = A.scrollWidth <= tick.clientWidth + 1;
  const move = !fits && !reduceMotion.matches;
  B.style.display = move ? "" : "none";
  tick.classList.toggle("static", fits);
  tick.classList.toggle("moving", move);
  tick.classList.toggle("scroll", !fits && !move);
  ticker.moving = move;
  ticker.setW = A.offsetWidth + 10; // one copy of the list and the gap before the next
  if (move) ticker.off %= ticker.setW; else { ticker.off = 0; track.style.transform = ""; }
}
function tickerFrame(now) {
  requestAnimationFrame(tickerFrame);
  const dt = Math.min(0.1, (now - (ticker.last || now)) / 1000); ticker.last = now;
  if (!ticker.moving || ticker.paused || !ticker.setW) return;
  ticker.off = (ticker.off + dt * 35 / K) % ticker.setW; // 35 screen px a second, whatever the HUD's scale
  document.getElementById("track").style.transform = `translate3d(${(-ticker.off).toFixed(2)}px,0,0)`;
}
{
  const tick = document.getElementById("tick");
  let resume = 0;
  tick.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") ticker.paused = true; });
  tick.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") ticker.paused = false; });
  tick.addEventListener("touchstart", () => { ticker.paused = true; clearTimeout(resume); }, { passive: true });
  tick.addEventListener("touchend", () => { clearTimeout(resume); resume = setTimeout(() => (ticker.paused = false), 1500); }, { passive: true });
  reduceMotion.addEventListener?.("change", tickerLayout);
  requestAnimationFrame(tickerFrame);
}

// Drawers: the side panel and the feed/chat fold down to their header. The choice is remembered per drawer; the

function drawerOpen(name) { let v = null; try { v = localStorage.getItem(`pezz.drawer.${name}`); } catch {} return v ? v === "open" : Math.min(innerWidth, screen.width || innerWidth) >= 640 && !(SPECTATOR && name === "side"); }

  detailsFor = selected; detailsAt = Date.now();

}

  const stats = d ? [d.speed != null ? `${d.speed} t/s` : null, d.weapon ? esc(d.weapon) : null, d.armor].filter(Boolean).join(" · ") : "";
