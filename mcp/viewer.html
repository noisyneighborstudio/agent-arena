<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pezz: your view</title>
<style>
  :root { --bg:#141113; --panel:rgba(20,17,19,.88); --cream:#ECE4D2; --muted:#9c9488; --amber:#FFA22E; --crit:#ff5a4a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--cream); font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:grab; }
  #live { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#141113; display:none; cursor:grab; user-select:none; -webkit-user-drag:none; }
  body.live #live { display:block; }
  body.live canvas { visibility:hidden; }
  #mode { cursor:pointer; color:var(--cream); text-decoration:underline; }
  canvas:active { cursor:grabbing; }
  .panel { position:absolute; background:var(--panel); border:1px solid rgba(236,228,210,.12); border-radius:10px; padding:10px 12px; backdrop-filter:blur(6px); }
  #top { top:12px; left:12px; min-width:260px; }
  #top .who { font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .chip { width:12px; height:12px; border-radius:3px; display:inline-block; }
  #top .meta { color:var(--muted); margin-top:2px; }
  #stock { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; margin-top:8px; font-variant-numeric:tabular-nums; }
  #stock span b { font-weight:600; }
  #teams { top:12px; right:12px; min-width:220px; }
  #teams div { display:flex; justify-content:space-between; gap:10px; padding:1px 0; }
  #teams .out { opacity:.45; text-decoration:line-through; }
  #alerts { top:12px; left:50%; transform:translateX(-50%); max-width:560px; display:none; border-left:6px solid; border-image:repeating-linear-gradient(45deg,#1e1b1d 0 6px,#ece4d2 6px 12px) 6; }
  #alerts div { padding:1px 0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  #alerts div:hover { text-decoration:underline; }
  #alerts .more { color:var(--muted); cursor:default; text-decoration:none !important; font-size:12px; }
  #chat { bottom:12px; left:12px; max-width:520px; color:var(--muted); }
  #chat div { padding:1px 0; }
  #help { bottom:12px; right:12px; color:var(--muted); font-size:12px; }
  /* Phones and narrow windows: stack the panels instead of overlapping them. */
  @media (max-width: 720px) {
    #teams { top:auto; bottom:12px; left:12px; right:12px; min-width:0; }
    #teams #tl { display:grid; grid-template-columns:1fr 1fr; column-gap:16px; }
    #alerts { top:104px; left:12px; right:12px; transform:none; max-width:none; }
    #help, #chat { display:none; }
  }
  #orders { margin-top:8px; color:var(--muted); font-size:12px; max-width:320px; }
  .title { letter-spacing:.08em; font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="live" alt="">
<div class="panel" id="top">
  <div class="who"><span class="chip" id="chip"></span><span id="who">Connecting…</span></div>
  <div class="meta" id="meta"></div>
  <div id="stock"></div>
  <div id="orders"></div>
</div>
<div class="panel" id="alerts"></div>
<div class="panel" id="teams"><div class="title">Commanders</div><div id="tl"></div></div>
<div class="panel" id="chat"><div class="title">Arena chat</div><div id="cl"></div></div>
<div class="panel" id="help"><span id="mode">Map view</span> · <b>L</b> live / map · drag to pan · scroll to zoom · <b>F</b> your base · <b>M</b> whole map</div>
<script>
const BASE = "__BASE__"; // /view/<token> for a player's own fogged view, /watch for the delayed public spectator view
const FLAVORS = ["#2E73FF", "#F22E1F", "#33D94D", "#FFD126", "#8E44D9", "#FF8A1F", "#2ED3B7", "#E83E8C"];
const TERRAIN = { g: "#7D6E55", d: "#7A6B53", r: "#4A3F40", w: "#3A2218" };
const ORE = { i: "#8A3A24", c: "#C8742F", x: "#8FE4FF", u: "#B6FF3B" };
const AIR = new Set(["gunship", "stealth_bomber", "recon_drone", "transport_chopper"]);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let map = null, frame = null, mapVersion = -1, terrainCanvas = null, shroudCanvas = document.createElement("canvas");
let cam = { x: 40, y: 40, scale: 8 }, fitted = false;
const icons = {};
function icon(key) {
  if (!(key in icons)) { const im = new Image(); im.src = `/icons/${key}.png`; icons[key] = im; im.onerror = () => (icons[key] = null); }
  return icons[key] && icons[key].complete && icons[key].naturalWidth ? icons[key] : null;
}

async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }

async function loadMap() {
  map = await getJSON(`${BASE}/map`);
  mapVersion = map.version;
  terrainCanvas = document.createElement("canvas");
  terrainCanvas.width = map.w; terrainCanvas.height = map.h;
  const t = terrainCanvas.getContext("2d"), img = t.createImageData(map.w, map.h);
  for (let y = 0; y < map.h; y++)
    for (let x = 0; x < map.w; x++) {
      const i = y * map.w + x, o = map.ore[i];
      const hex = o !== "." ? ORE[o] : TERRAIN[map.tiles[i]];
      const p = ((map.h - 1 - y) * map.w + x) * 4; // north up
      img.data[p] = parseInt(hex.slice(1, 3), 16); img.data[p + 1] = parseInt(hex.slice(3, 5), 16); img.data[p + 2] = parseInt(hex.slice(5, 7), 16); img.data[p + 3] = 255;
      if (o !== ".") { img.data[p] = (img.data[p] + 125) / 2; img.data[p + 1] = (img.data[p + 1] + 110) / 2; img.data[p + 2] = (img.data[p + 2] + 85) / 2; }
    }
  t.putImageData(img, 0, 0);
  shroudCanvas.width = map.w; shroudCanvas.height = map.h;
  if (!fitted) fitAll();
}

function fitAll() { if (!map) return; cam.x = map.w / 2; cam.y = map.h / 2; cam.scale = Math.min(cv.width / map.w, cv.height / map.h) * 0.92; fitted = true; }
function focusBase() {
  if (!frame?.you) return fitAll();
  const hq = frame.entities.find((e) => e[2] === frame.you.team && e[1] === "command_center") || frame.entities.find((e) => e[2] === frame.you.team);
  if (hq) { cam.x = hq[3]; cam.y = hq[4]; cam.scale = Math.max(cam.scale, 14); }
}

async function tick() {
  try {
    frame = await getJSON(`${BASE}/frame`);
    if (frame.waiting) { document.getElementById("who").textContent = frame.waiting; setTimeout(tick, 2000); return; }
    if (!map || frame.version !== mapVersion) await loadMap();
    if (frame.shroud) {
      const s = shroudCanvas.getContext("2d"), img = s.createImageData(map.w, map.h);
      for (let y = 0; y < map.h; y++)
        for (let x = 0; x < map.w; x++) {
          const v = frame.shroud[y * map.w + x], p = ((map.h - 1 - y) * map.w + x) * 4;
          img.data[p] = 12; img.data[p + 1] = 10; img.data[p + 2] = 14; img.data[p + 3] = v === "2" ? 0 : v === "1" ? 115 : 235;
        }
      s.putImageData(img, 0, 0);
    }
    hud();
  } catch (e) {
    document.getElementById("who").textContent = `Not connected: ${e.message}`;
  }
  setTimeout(tick, 250);
}

function hud() {
  const you = frame.you;
  const col = you ? FLAVORS[you.team % 8] : "#ECE4D2";
  document.getElementById("chip").style.background = col;
  document.getElementById("who").textContent = you ? `${you.flavor} · ${you.player ?? ""}` : `Spectator${frame.delay_s ? ` · ${frame.delay_s}s delay` : ""}`;
  const mm = Math.floor(frame.time_s / 60), ss = String(Math.floor(frame.time_s % 60)).padStart(2, "0");
  document.getElementById("meta").textContent = you ? `${mm}:${ss} · ${you.status} · power ${you.power} · map ${map.w}×${map.h}` : `${mm}:${ss}`;
  document.getElementById("stock").innerHTML = you ? Object.entries(you.stockpile).map(([k, v]) => `<span>${k.replace("_ore", "")} <b>${v}</b></span>`).join("") : "";
  document.getElementById("orders").textContent = you?.standing_orders ? `Orders: ${you.standing_orders}` : "";
  document.getElementById("tl").innerHTML = frame.teams.map((t) =>
    `<div class="${t.status !== "playing" ? "out" : ""}"><span><span class="chip" style="background:${FLAVORS[t.id % 8]}"></span> ${esc(t.flavor)} <span style="color:var(--muted)">${esc(t.player ?? "")}</span></span><span>${t.kills}</span></div>`).join("");
  document.getElementById("cl").innerHTML = (frame.chat || []).slice(-6).map((c) => `<div>${esc(c)}</div>`).join("");
  const al = document.getElementById("alerts");
  // One short line per alert (the agent-facing detail is in the tooltip); click to look there.
  if (frame.alerts?.length) {
    al.style.display = "block";
    const shown = frame.alerts.slice(0, 3);
    al.innerHTML = shown.map((a) => {
      const at = /\((\d+),(\d+)\)/.exec(a);
      return `<div style="color:${a.startsWith("CRITICAL") ? "var(--crit)" : "var(--amber)"}" title="${esc(a)}"${at ? ` data-x="${at[1]}" data-y="${at[2]}"` : ""}>${esc(a.split(";")[0])}</div>`;
    }).join("") + (frame.alerts.length > shown.length ? `<div class="more">+${frame.alerts.length - shown.length} more</div>` : "");
  }
  else al.style.display = "none";
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// World (x east, y north) -> screen.
const sx = (x) => cv.width / 2 + (x - cam.x) * cam.scale;
const sy = (y) => cv.height / 2 - (y - cam.y) * cam.scale;

const seenFx = new Set(), bursts = [];
function draw() {
  requestAnimationFrame(draw);
  const dpr = devicePixelRatio || 1;
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; if (!fitted) fitAll(); }
  ctx.fillStyle = "#141113"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!map || !frame) return;
  const s = cam.scale;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(terrainCanvas, sx(0), sy(map.h), map.w * s, map.h * s);
  // Sector grid A-H x 1-8.
  ctx.strokeStyle = "rgba(236,228,210,.10)"; ctx.lineWidth = 1;
  ctx.fillStyle = "rgba(236,228,210,.45)"; ctx.font = `${Math.max(10, s * 1.2)}px sans-serif`;
  for (let i = 0; i <= 8; i++) {
    const gx = sx(i * map.w / 8), gy = sy(i * map.h / 8);
    ctx.beginPath(); ctx.moveTo(gx, sy(0)); ctx.lineTo(gx, sy(map.h)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(0), gy); ctx.lineTo(sx(map.w), gy); ctx.stroke();
    if (i < 8) { ctx.fillText("ABCDEFGH"[i], gx + 4, sy(map.h) + 14); ctx.fillText(String(8 - i), sx(0) + 4, gy - 4 + (i === 0 ? 0 : 0)); }
  }
  // Structures, then ground units, then aircraft.
  const ents = frame.entities;
  for (const e of ents) if (e[8] > 0) drawStructure(e, s);
  for (const e of ents) if (e[8] === 0 && !AIR.has(e[1])) drawUnit(e, s);
  for (const e of ents) if (AIR.has(e[1])) drawUnit(e, s, true);
  // Shots and blasts.
  for (const f of frame.effects) {
    const [seq, type, x, y, x2, y2] = f;
    if (type === "shot") { ctx.strokeStyle = "rgba(255,226,140,.8)"; ctx.lineWidth = Math.max(1, s * 0.06); ctx.beginPath(); ctx.moveTo(sx(x), sy(y)); ctx.lineTo(sx(x2), sy(y2)); ctx.stroke(); }
    if ((type === "hit" || type === "destroyed") && !seenFx.has(seq)) { seenFx.add(seq); bursts.push({ x, y, t: performance.now(), big: type === "destroyed" }); }
  }
  const now = performance.now();
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], k = (now - b.t) / (b.big ? 900 : 450);
    if (k >= 1) { bursts.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255,${140 + 80 * (1 - k)},60,${0.8 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(sx(b.x), sy(b.y), s * (b.big ? 1.6 : 0.6) * (0.4 + k), 0, Math.PI * 2); ctx.fill();
  }
  if (seenFx.size > 4000) seenFx.clear();
  // Fog: unexplored is near black; explored but not in sight is dimmed.
  if (frame.shroud) { ctx.imageSmoothingEnabled = true; ctx.drawImage(shroudCanvas, sx(0), sy(map.h), map.w * s, map.h * s); }
}

function drawStructure(e, s) {
  const [, key, team, x, y, hp, , build, size] = e;
  const half = size / 2, px = sx(x - half), py = sy(y + half), w = size * s;
  ctx.globalAlpha = build < 100 ? 0.55 : 1;
  ctx.fillStyle = "#ECE4D2"; ctx.fillRect(px, py, w, w);
  ctx.fillStyle = FLAVORS[team % 8]; ctx.fillRect(px, py, w, Math.max(3, w * 0.18));
  ctx.strokeStyle = "#1E1B1D"; ctx.lineWidth = Math.max(1, s * 0.08); ctx.strokeRect(px, py, w, w);
  const im = icon(key);
  if (im && w > 18) ctx.drawImage(im, px + w * 0.1, py + w * 0.22, w * 0.8, w * 0.6);
  ctx.globalAlpha = 1;
  if (build < 100) bar(px, py + w + 2, w, build / 100, "#FFA22E");
  else if (hp < 100) bar(px, py + w + 2, w, hp / 100, hp > 50 ? "#7fd36b" : "#ff5a4a");
}

function drawUnit(e, s, air) {
  const [, key, team, x, y, hp, facing] = e;
  const r = Math.max(2.5, s * (key === "mine" ? 0.18 : 0.32)), px = sx(x), py = sy(y);
  if (air) { ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(px + s * 0.6, py + s * 0.9, r, r * 0.6, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = FLAVORS[team % 8]; ctx.strokeStyle = "#1E1B1D"; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.beginPath();
  if (air) { ctx.moveTo(px, py - r * 1.3); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r * 1.3); ctx.lineTo(px - r, py); ctx.closePath(); }
  else ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#ECE4D2"; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(facing) * r * 1.4, py - Math.sin(facing) * r * 1.4); ctx.stroke();
  if (hp < 100 && s > 6) bar(px - r, py + r + 2, r * 2, hp / 100, hp > 50 ? "#7fd36b" : "#ff5a4a");
}

function bar(x, y, w, f, color) { ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y, w, 3); ctx.fillStyle = color; ctx.fillRect(x, y, w * f, 3); }

// Pan and zoom.
let drag = null;
cv.addEventListener("mousedown", (e) => (drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }));
addEventListener("mouseup", () => (drag = null));
addEventListener("mousemove", (e) => { if (!drag) return; const d = devicePixelRatio || 1; cam.x = drag.cx - (e.clientX - drag.x) * d / cam.scale; cam.y = drag.cy + (e.clientY - drag.y) * d / cam.scale; });
cv.addEventListener("wheel", (e) => { e.preventDefault(); cam.scale = Math.max(2, Math.min(60, cam.scale * (e.deltaY < 0 ? 1.12 : 0.89))); }, { passive: false });
document.getElementById("alerts").addEventListener("click", (e) => {
  const d = e.target.closest("[data-x]");
  if (!d) return;
  const x = Number(d.dataset.x), y = Number(d.dataset.y);
  if (liveMode) fetch(`${BASE}/cam?x=${x}&y=${y}`);
  else { cam.x = x + 0.5; cam.y = y + 0.5; cam.scale = Math.max(cam.scale, 14); }
});
addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") focusBase(); if (e.key === "m" || e.key === "M") fitAll(); });
// High-res live stream of this player's own view, rendered by the game host (when it has a renderer).
const liveImg = document.getElementById("live");
let liveOk = false, liveMode = false, liveFails = 0;
function setMode(live) {
  liveMode = live && liveOk;
  document.body.classList.toggle("live", liveMode);
  document.getElementById("mode").textContent = liveMode ? "Live view (switch to map)" : liveOk ? "Map view (switch to live)" : "Map view";
}
async function liveLoop() {
  if (!BASE.startsWith("/view/")) return; // the public spectator page has no personal stream
  try {
    const r = await fetch(`${BASE}/live.jpg?${Date.now()}`, { cache: "no-store" });
    if (r.ok) {
      const url = URL.createObjectURL(await r.blob());
      const old = liveImg.src; liveImg.src = url; if (old.startsWith("blob:")) URL.revokeObjectURL(old);
      if (!liveOk) { liveOk = true; setMode(true); }
      liveFails = 0;
    } else if (r.status === 404 && ++liveFails > 3) { liveOk = false; setMode(false); setTimeout(liveLoop, 15000); return; }
  } catch { liveFails++; }
  setTimeout(liveLoop, 150);
}
document.getElementById("mode").addEventListener("click", () => setMode(!liveMode));
// In live mode, dragging and scrolling steer the stream's camera (it returns to following the action after 20s).
let camAcc = { dx: 0, dy: 0, zoom: 1, yaw: 0 }, camBusy = false, camDrag = null;
function camFlush() {
  if (camBusy) return; const a = camAcc;
  if (!a.dx && !a.dy && a.zoom === 1 && !a.yaw) return;
  camAcc = { dx: 0, dy: 0, zoom: 1, yaw: 0 }; camBusy = true;
  fetch(`${BASE}/cam?dx=${a.dx.toFixed(4)}&dy=${a.dy.toFixed(4)}&zoom=${a.zoom.toFixed(3)}&yaw=${a.yaw}`).finally(() => { camBusy = false; setTimeout(camFlush, 30); });
}
liveImg.addEventListener("mousedown", (e) => { camDrag = { x: e.clientX, y: e.clientY }; e.preventDefault(); });
addEventListener("mouseup", () => (camDrag = null));
addEventListener("mousemove", (e) => { if (!camDrag || !liveMode) return; const r = liveImg.getBoundingClientRect(); camAcc.dx -= (e.clientX - camDrag.x) / r.width; camAcc.dy += (e.clientY - camDrag.y) / r.height; camDrag = { x: e.clientX, y: e.clientY }; camFlush(); });
liveImg.addEventListener("wheel", (e) => { e.preventDefault(); camAcc.zoom *= e.deltaY < 0 ? 0.9 : 1.11; camFlush(); }, { passive: false });
addEventListener("keydown", (e) => { if (!liveMode) return; const k = e.key.toLowerCase(); if (k === "q") camAcc.yaw += 15; if (k === "e") camAcc.yaw -= 15; camFlush(); });
addEventListener("keydown", (e) => { if (e.key === "l" || e.key === "L") setMode(!liveMode); });
tick(); draw(); liveLoop();
setTimeout(focusBase, 1500);
</script>
</body>
</html>
